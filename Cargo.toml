[workspace]
members = [
  "apps/bridge",
  "apps/control-plane",
  "crates/application",
  "crates/domain",
  "crates/protocol-conformance",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/agent-room/agent-room"

[workspace.dependencies]
agent-room-application = { version = "0.1.0", path = "crates/application" }
agent-room-domain = { version = "0.1.0", path = "crates/domain" }
agent-room-protocol-conformance = { version = "0.1.0", path = "crates/protocol-conformance" }
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
futures-util = "0.3.32"
jsonschema = { version = "0.50.1", default-features = false }
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace"] }
proptest = "1.11.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
url = "2.5.7"
uuid = { version = "1.25.0", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
