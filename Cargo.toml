[workspace]
members = [
  "apps/bridge",
  "apps/control-plane",
  "crates/application",
  "crates/bridge-core",
  "crates/bridge-ipc",
  "crates/domain",
  "crates/identity-adapter",
  "crates/matrix-adapter",
  "crates/matrix-provisioning-adapter",
  "crates/postgres-adapter",
  "crates/protocol-conformance",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/agent-room/agent-room"

[workspace.dependencies]
agent-room-application = { version = "0.1.0", path = "crates/application" }
agent-room-bridge-core = { version = "0.1.0", path = "crates/bridge-core" }
agent-room-bridge-ipc = { version = "0.1.0", path = "crates/bridge-ipc" }
agent-room-domain = { version = "0.1.0", path = "crates/domain" }
agent-room-identity-adapter = { version = "0.1.0", path = "crates/identity-adapter" }
agent-room-matrix-adapter = { version = "0.1.0", path = "crates/matrix-adapter" }
agent-room-matrix-provisioning-adapter = { version = "0.1.0", path = "crates/matrix-provisioning-adapter" }
agent-room-postgres-adapter = { version = "0.1.0", path = "crates/postgres-adapter" }
agent-room-protocol-conformance = { version = "0.1.0", path = "crates/protocol-conformance" }
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.22.1"
chrono = "0.4.45"
ed25519-dalek = { version = "2.2.0", features = ["zeroize"] }
futures-util = "0.3.32"
getrandom = "0.3.4"
hmac = "0.13.0"
interprocess = { version = "2.4.3", features = ["tokio"] }
jsonschema = { version = "0.50.1", default-features = false }
keyring = "4.1.6"
matrix-sdk = { version = "0.18.0", default-features = false }
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
proptest = "1.11.0"
rand = "0.8.7"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rsa = { version = "0.9.10", features = ["pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid"] }
thiserror = "2.0.20"
tempfile = "3.25.0"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
url = "2.5.7"
uuid = { version = "1.25.0", features = ["serde", "v7"] }
widestring = "1.2.1"
win-security-identifier = "0.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
