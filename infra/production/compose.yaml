name: ${AGENT_ROOM_PROJECT_NAME:?缺少 AGENT_ROOM_PROJECT_NAME}

x-common-security: &common-security
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

# 容器日志写在主机的 Docker 目录里，默认不滚动、一直留着；聊天服务器的访问日志还带着用户的 IP。
# 每个服务都设上限，写满就覆盖最旧的（隐私说明写的是“服务器日志自动覆盖”）。
x-container-logging: &container-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# 聊天服务器和控制面一天写几十 MB，多留一些，排查和发版验收时还翻得到最近一两天。
x-busy-container-logging: &busy-container-logging
  driver: json-file
  options:
    max-size: 50m
    max-file: '4'

x-control-plane-runtime: &control-plane-runtime
  image: ${AGENT_ROOM_CONTROL_PLANE_IMAGE:-agent-room-control-plane:local}
  build:
    context: ../..
    dockerfile: infra/production/Containerfile.control-plane

x-identity-registration-reconcile: &identity-registration-reconcile
  image: matrixdotorg/synapse:v1.159.0
  profiles: [provisioning]
  entrypoint: [python3, /scripts/keycloak-registration-reconcile.py]
  depends_on:
    identity:
      condition: service_healthy
  volumes:
    - ./keycloak-registration-reconcile.py:/scripts/keycloak-registration-reconcile.py:ro
  read_only: true
  tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
  networks: [backend]

services:
  postgres:
    logging: *container-logging
    profiles: [embedded-database]
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: agent_room_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=${AGENT_ROOM_BACKUP_ARCHIVE_TIMEOUT_SECONDS:-900}s
      - -c
      # 先写临时文件、落盘再改名，归档目录里只会出现完整的段。同名的已经在了，内容一样才算归档过：
      # 崩溃以后 PostgreSQL 会把归档过、还没来得及记下的段再归档一次。
      - archive_command=if test -f /archive/%f; then cmp -s %p /archive/%f; else cp %p /archive/.%f.partial && sync /archive/.%f.partial && mv /archive/.%f.partial /archive/%f; fi
      - -c
      # WAL 里大部分是整页镜像（specs/backups/design.md），先压缩再写；检查点从 5 分钟一次改成
      # 15 分钟一次，整页镜像跟着少。改了要重建 PostgreSQL 容器才生效，发版部署不重建它。
      - wal_compression=zstd
      - -c
      - checkpoint_timeout=15min
      - -c
      - hba_file=/etc/postgresql/agent-room-pg-hba.conf
    secrets:
      - postgres_bootstrap_password
      - agent_room_db_migration_password
      - agent_room_db_runtime_password
      - postgres_metrics_password
      - synapse_db_password
      - keycloak_db_password
    volumes:
      - ${AGENT_ROOM_STATE_DIR:?缺少 AGENT_ROOM_STATE_DIR}/data/postgres:/var/lib/postgresql
      - ${AGENT_ROOM_BACKUP_REPOSITORY:?缺少 AGENT_ROOM_BACKUP_REPOSITORY}/wal:/archive
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/001-agent-room.sh:ro
      - ./postgres-pg-hba.conf:/etc/postgresql/agent-room-pg-hba.conf:ro
    healthcheck:
      test:
        [
          CMD-SHELL,
          'test "$$(cat /proc/1/comm)" = postgres && pg_isready -U agent_room_bootstrap -d postgres',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 60s
    networks: [backend]

  identity:
    logging: *container-logging
    build:
      context: ../..
      dockerfile: infra/production/Containerfile.identity
    command:
      - start
      - --optimized
      - --import-realm
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --server-async-bootstrap=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${AGENT_ROOM_DB_HOST:?缺少数据库主机}:${AGENT_ROOM_DB_PORT:?缺少数据库端口}/${KEYCLOAK_DB_NAME:?缺少身份数据库名}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?缺少身份数据库用户}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_HOSTNAME: https://${AGENT_ROOM_IDENTITY_DOMAIN:?缺少身份域名}
      KC_BOOTSTRAP_ADMIN_USERNAME: agent-room-admin
    labels:
      org.agent-room.generated-config-digest: ${AGENT_ROOM_GENERATED_CONFIG_DIGEST:?缺少生成配置摘要}
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
    volumes:
      - ${AGENT_ROOM_STATE_DIR}/generated/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          CMD-SHELL,
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 60
    read_only: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /opt/keycloak/data/tmp:rw,noexec,nosuid,size=128m
      - /opt/keycloak/data/transaction-logs:rw,noexec,nosuid,size=64m
    networks: [backend]

  identity-registration-close:
    logging: *container-logging
    <<: [*identity-registration-reconcile, *common-security]
    environment:
      AGENT_ROOM_IDENTITY_REGISTRATION_MODE: closed
      AGENT_ROOM_KEYCLOAK_INTERNAL_URL: http://identity:8080
      AGENT_ROOM_KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      AGENT_ROOM_KEYCLOAK_ACCOUNT_ADMIN_CLIENT_SECRET_FILE: /run/secrets/keycloak_account_admin_client_secret
      AGENT_ROOM_OIDC_REDIRECT_URL: https://${AGENT_ROOM_APP_DOMAIN}${AGENT_ROOM_BROWSER_OIDC_CALLBACK_PATH}
      AGENT_ROOM_FRONTEND_ORIGIN: https://${AGENT_ROOM_APP_DOMAIN}
    secrets: [keycloak_admin_password, keycloak_account_admin_client_secret]

  identity-registration-open:
    logging: *container-logging
    <<: [*identity-registration-reconcile, *common-security]
    environment:
      AGENT_ROOM_IDENTITY_REGISTRATION_MODE: open-email
      AGENT_ROOM_KEYCLOAK_INTERNAL_URL: http://identity:8080
      AGENT_ROOM_KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      AGENT_ROOM_KEYCLOAK_ACCOUNT_ADMIN_CLIENT_SECRET_FILE: /run/secrets/keycloak_account_admin_client_secret
      AGENT_ROOM_OIDC_REDIRECT_URL: https://${AGENT_ROOM_APP_DOMAIN}${AGENT_ROOM_BROWSER_OIDC_CALLBACK_PATH}
      AGENT_ROOM_FRONTEND_ORIGIN: https://${AGENT_ROOM_APP_DOMAIN}
      AGENT_ROOM_SMTP_HOST: ${AGENT_ROOM_SMTP_HOST:-}
      AGENT_ROOM_SMTP_PORT: ${AGENT_ROOM_SMTP_PORT:-}
      AGENT_ROOM_SMTP_FROM_ADDRESS: ${AGENT_ROOM_SMTP_FROM_ADDRESS:-}
      AGENT_ROOM_SMTP_FROM_DISPLAY_NAME: ${AGENT_ROOM_SMTP_FROM_DISPLAY_NAME:-}
      AGENT_ROOM_SMTP_USERNAME: ${AGENT_ROOM_SMTP_USERNAME:-}
      AGENT_ROOM_SMTP_ENCRYPTION: ${AGENT_ROOM_SMTP_ENCRYPTION:-}
      AGENT_ROOM_SMTP_PASSWORD_FILE: /run/secrets/identity_smtp_password
    secrets: [keycloak_admin_password, keycloak_account_admin_client_secret, identity_smtp_password]

  object-store:
    logging: *container-logging
    profiles: [embedded-object-store]
    image: ghcr.io/chrislusf/seaweedfs:4.44
    command:
      - server
      - -s3
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -s3.config=/config/s3.json
    labels:
      org.agent-room.generated-config-digest: ${AGENT_ROOM_GENERATED_CONFIG_DIGEST:?缺少生成配置摘要}
    volumes:
      - ${AGENT_ROOM_STATE_DIR}/data/object-store:/data
      - ${AGENT_ROOM_STATE_DIR}/generated/seaweedfs:/config:ro
    read_only: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    networks: [backend]

  content-scanner:
    logging: *container-logging
    image: clamav/clamav:1.5.4
    volumes:
      - ${AGENT_ROOM_STATE_DIR}/data/clamav:/var/lib/clamav
    healthcheck:
      test: [CMD-SHELL, clamdscan --ping 1]
      interval: 30s
      timeout: 10s
      retries: 40
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [backend]

  redis:
    logging: *container-logging
    profiles: [workers]
    image: redis:8.2.2-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    restart: unless-stopped
    <<: *common-security
    tmpfs: ['/data:rw,noexec,nosuid,size=64m']
    networks: [backend]

  synapse:
    logging: *busy-container-logging
    image: matrixdotorg/synapse:v1.159.0
    environment:
      PYTHONPATH: /config
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
    labels:
      org.agent-room.generated-config-digest: ${AGENT_ROOM_GENERATED_CONFIG_DIGEST:?缺少生成配置摘要}
    volumes:
      - ${AGENT_ROOM_STATE_DIR}/generated/synapse:/config:ro
      - ${AGENT_ROOM_STATE_DIR}/data/synapse:/data
    healthcheck:
      test:
        [
          CMD-SHELL,
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8008/_matrix/client/versions'', timeout=3)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 60
    read_only: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    networks: [backend]

  telemetry:
    logging: *container-logging
    profiles: [telemetry]
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      test: [CMD, /otelcol-contrib, validate, --config=/etc/otelcol/config.yaml]
      interval: 30s
      timeout: 10s
      retries: 5
    read_only: true
    restart: unless-stopped
    <<: *common-security
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    networks: [backend]

  prometheus:
    logging: *container-logging
    profiles: [telemetry]
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=45d
      - --storage.tsdb.wal-compression
    labels:
      org.agent-room.generated-config-digest: ${AGENT_ROOM_GENERATED_CONFIG_DIGEST:?缺少生成配置摘要}
    ports:
      - 127.0.0.1:${AGENT_ROOM_PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ${AGENT_ROOM_STATE_DIR}/generated/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability-rules.yaml:/etc/prometheus/rules.yaml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [backend]

  alertmanager:
    logging: *container-logging
    profiles: [telemetry]
    image: prom/alertmanager:v0.33.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
    labels:
      org.agent-room.generated-config-digest: ${AGENT_ROOM_GENERATED_CONFIG_DIGEST:?缺少生成配置摘要}
    secrets: [alertmanager_webhook_token]
    volumes:
      - ${AGENT_ROOM_STATE_DIR}/generated/observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [backend]

  blackbox:
    logging: *container-logging
    profiles: [telemetry]
    image: prom/blackbox-exporter:v0.28.0
    command: [--config.file=/etc/blackbox/blackbox.yaml]
    volumes:
      - ./blackbox.yaml:/etc/blackbox/blackbox.yaml:ro
    read_only: true
    restart: unless-stopped
    <<: *common-security
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    networks: [backend]

  postgres-exporter:
    logging: *container-logging
    profiles: [telemetry]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: ${AGENT_ROOM_DB_HOST}:${AGENT_ROOM_DB_PORT}/postgres?sslmode=${AGENT_ROOM_DB_TLS_MODE}
      DATA_SOURCE_USER: ${AGENT_ROOM_DB_METRICS_USER}
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_metrics_password
      PG_EXPORTER_COLLECTION_TIMEOUT: 10s
    secrets: [postgres_metrics_password]
    read_only: true
    restart: unless-stopped
    <<: *common-security
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    networks: [backend]

  recovery-metrics:
    logging: *container-logging
    profiles: [telemetry]
    image: quay.io/prometheus/node-exporter:v1.12.1
    command:
      - --collector.disable-defaults
      - --collector.textfile.directory=/metrics
      - --web.listen-address=:9100
    volumes:
      - ${AGENT_ROOM_BACKUP_REPOSITORY}/metrics:/metrics:ro
    read_only: true
    restart: unless-stopped
    <<: *common-security
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    networks: [backend]

  grafana:
    logging: *container-logging
    profiles: [telemetry]
    image: grafana/grafana:13.1.0
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_ADMIN_USER: agent-room-admin
      GF_SERVER_DOMAIN: localhost
      GF_USERS_ALLOW_SIGN_UP: 'false'
    secrets: [grafana_admin_password]
    ports:
      - 127.0.0.1:${AGENT_ROOM_GRAFANA_PORT:-3000}:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [backend]

  migrate:
    logging: *container-logging
    <<: [*control-plane-runtime, *common-security]
    profiles: [migration]
    entrypoint: [/usr/local/bin/agent-room-migrate]
    environment:
      AGENT_ROOM_MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets: [migration_database_url]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    networks: [backend]

  object-store-init:
    logging: *container-logging
    <<: [*control-plane-runtime, *common-security]
    profiles: [provisioning]
    entrypoint: [/usr/local/bin/agent-room-provision-bucket]
    environment:
      AGENT_ROOM_CONTENT_S3_ENDPOINT: ${AGENT_ROOM_CONTENT_S3_ENDPOINT}
      AGENT_ROOM_CONTENT_S3_BUCKET: ${AGENT_ROOM_CONTENT_S3_BUCKET}
      AGENT_ROOM_CONTENT_S3_REGION: ${AGENT_ROOM_CONTENT_S3_REGION}
      AGENT_ROOM_CONTENT_S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      AGENT_ROOM_CONTENT_S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      AGENT_ROOM_CONTENT_S3_CREATE_BUCKET: ${AGENT_ROOM_CONTENT_S3_CREATE_BUCKET}
    secrets: [s3_access_key, s3_secret_key]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    networks: [backend]

  synapse-admin-bootstrap:
    logging: *container-logging
    image: matrixdotorg/synapse:v1.159.0
    profiles: [provisioning]
    entrypoint: [python, /scripts/synapse-admin-bootstrap.py]
    depends_on:
      synapse:
        condition: service_healthy
    secrets:
      - synapse_registration_secret
      - synapse_lifecycle_admin_password
    volumes:
      - ./synapse-admin-bootstrap.py:/scripts/synapse-admin-bootstrap.py:ro
      - ${AGENT_ROOM_STATE_DIR}/secrets:/output
    read_only: true
    <<: *common-security
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    networks: [backend]

  backup-permissions:
    logging: *container-logging
    image: postgres:18.6-alpine
    profiles: [backup]
    user: '0:0'
    entrypoint: [/bin/sh, -ec]
    command:
      - install -d -o 70 -g 70 -m 0750 /backup/wal
    volumes:
      - ${AGENT_ROOM_BACKUP_REPOSITORY}:/backup
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    networks: [backend]

  database-backup:
    logging: *container-logging
    image: postgres:18.6-alpine
    profiles: [backup]
    user: '${AGENT_ROOM_HOST_UID:-0}:${AGENT_ROOM_HOST_GID:-0}'
    entrypoint: [/bin/sh, /scripts/database-backup.sh]
    environment:
      AGENT_ROOM_BACKUP_ID: ${AGENT_ROOM_BACKUP_ID:-unset}
      AGENT_ROOM_DB_HOST: ${AGENT_ROOM_DB_HOST}
      AGENT_ROOM_DB_PORT: ${AGENT_ROOM_DB_PORT}
      AGENT_ROOM_DB_TLS_MODE: ${AGENT_ROOM_DB_TLS_MODE}
      AGENT_ROOM_DB_NAME: ${AGENT_ROOM_DB_NAME}
      AGENT_ROOM_DB_MIGRATION_USER: ${AGENT_ROOM_DB_MIGRATION_USER}
      SYNAPSE_DB_NAME: ${SYNAPSE_DB_NAME}
      SYNAPSE_DB_USER: ${SYNAPSE_DB_USER}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
    secrets:
      - agent_room_db_migration_password
      - synapse_db_password
      - keycloak_db_password
    volumes:
      - ${AGENT_ROOM_BACKUP_REPOSITORY}:/backup
      - ./database-backup.sh:/scripts/database-backup.sh:ro
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    networks: [backend]

  postgres-base-backup:
    logging: *container-logging
    image: postgres:18.6-alpine
    profiles: [backup]
    user: '0:0'
    entrypoint: [/bin/sh, /scripts/postgres-base-backup.sh]
    environment:
      AGENT_ROOM_BACKUP_ID: ${AGENT_ROOM_BACKUP_ID:-unset}
      AGENT_ROOM_DB_HOST: ${AGENT_ROOM_DB_HOST}
      AGENT_ROOM_DB_PORT: ${AGENT_ROOM_DB_PORT}
      AGENT_ROOM_DB_TLS_MODE: ${AGENT_ROOM_DB_TLS_MODE}
    secrets: [postgres_bootstrap_password]
    volumes:
      - ${AGENT_ROOM_BACKUP_REPOSITORY}:/backup
      - ${AGENT_ROOM_BACKUP_REPOSITORY}/wal:/archive:ro
      - ./postgres-base-backup.sh:/scripts/postgres-base-backup.sh:ro
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    networks: [backend]

  postgres-wal-archive:
    logging: *container-logging
    image: postgres:18.6-alpine
    profiles: [backup]
    user: '0:0'
    entrypoint: [/bin/sh, /scripts/postgres-wal-archive.sh]
    environment:
      AGENT_ROOM_BACKUP_ID: ${AGENT_ROOM_BACKUP_ID:-unset}
      AGENT_ROOM_WAL_ANCHOR: ${AGENT_ROOM_WAL_ANCHOR:-}
      AGENT_ROOM_DB_HOST: ${AGENT_ROOM_DB_HOST}
      AGENT_ROOM_DB_PORT: ${AGENT_ROOM_DB_PORT}
      AGENT_ROOM_DB_TLS_MODE: ${AGENT_ROOM_DB_TLS_MODE}
      AGENT_ROOM_HOST_UID: ${AGENT_ROOM_HOST_UID:-0}
      AGENT_ROOM_HOST_GID: ${AGENT_ROOM_HOST_GID:-0}
    secrets: [postgres_bootstrap_password]
    volumes:
      # 归档目录是仓库里的 wal/，和 wal-store/ 在同一个挂载里，核对时硬链接、收好以后删原文件。
      - ${AGENT_ROOM_BACKUP_REPOSITORY}:/backup
      - ./postgres-wal-archive.sh:/scripts/postgres-wal-archive.sh:ro
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    networks: [backend]

  backup-ownership:
    logging: *container-logging
    image: postgres:18.6-alpine
    profiles: [backup]
    user: '0:0'
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        case "$$AGENT_ROOM_BACKUP_ID" in
          [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]Z-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
          *) echo '备份 ID 无效' >&2; exit 1 ;;
        esac
        chown -R "$$AGENT_ROOM_HOST_UID:$$AGENT_ROOM_HOST_GID" "/backup/.partial-$$AGENT_ROOM_BACKUP_ID"
        chmod 0700 "/backup/.partial-$$AGENT_ROOM_BACKUP_ID"
    environment:
      AGENT_ROOM_BACKUP_ID: ${AGENT_ROOM_BACKUP_ID:-unset}
      AGENT_ROOM_HOST_UID: ${AGENT_ROOM_HOST_UID:-0}
      AGENT_ROOM_HOST_GID: ${AGENT_ROOM_HOST_GID:-0}
    volumes:
      - ${AGENT_ROOM_BACKUP_REPOSITORY}:/backup
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    networks: [backend]

  object-backup:
    logging: *container-logging
    image: rclone/rclone:1.75.1
    profiles: [backup]
    user: '${AGENT_ROOM_HOST_UID:-0}:${AGENT_ROOM_HOST_GID:-0}'
    entrypoint: [/bin/sh, /scripts/object-backup.sh]
    environment:
      AGENT_ROOM_BACKUP_ID: ${AGENT_ROOM_BACKUP_ID:-unset}
      AGENT_ROOM_CONTENT_S3_ENDPOINT: ${AGENT_ROOM_CONTENT_S3_ENDPOINT}
      AGENT_ROOM_CONTENT_S3_BUCKET: ${AGENT_ROOM_CONTENT_S3_BUCKET}
    secrets: [s3_access_key, s3_secret_key]
    volumes:
      - ${AGENT_ROOM_BACKUP_REPOSITORY}:/backup
      - ./object-backup.sh:/scripts/object-backup.sh:ro
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    networks: [backend]

  control-plane:
    logging: *busy-container-logging
    <<: [*control-plane-runtime, *common-security]
    environment:
      AGENT_ROOM_BIND_ADDRESS: 0.0.0.0:8090
      AGENT_ROOM_DB_HOST: ${AGENT_ROOM_DB_HOST}
      AGENT_ROOM_DB_PORT: ${AGENT_ROOM_DB_PORT}
      AGENT_ROOM_DB_NAME: ${AGENT_ROOM_DB_NAME}
      AGENT_ROOM_DB_USER: ${AGENT_ROOM_DB_RUNTIME_USER}
      AGENT_ROOM_DB_RUNTIME_PASSWORD_FILE: /run/secrets/agent_room_db_runtime_password
      AGENT_ROOM_DB_TLS_MODE: ${AGENT_ROOM_DB_TLS_MODE}
      AGENT_ROOM_MATRIX_BASE_URL: http://synapse:8008
      AGENT_ROOM_MATRIX_APPSERVICE_TOKEN_FILE: /run/secrets/synapse_appservice_token
      AGENT_ROOM_MATRIX_ADMIN_ACCESS_TOKEN_FILE: /run/secrets/synapse_lifecycle_admin_token
      AGENT_ROOM_ACCOUNT_DELETION_RECEIPT_SECRET_FILE: /run/secrets/account_deletion_receipt_secret
      # 删除账户时经内部地址删掉 Keycloak 里的登录账户。
      AGENT_ROOM_KEYCLOAK_INTERNAL_URL: http://identity:8080
      AGENT_ROOM_KEYCLOAK_ACCOUNT_ADMIN_CLIENT_SECRET_FILE: /run/secrets/keycloak_account_admin_client_secret
      AGENT_ROOM_OBJECT_STORE_HEALTH_URL: ${AGENT_ROOM_OBJECT_STORE_HEALTH_URL}
      AGENT_ROOM_DEPENDENCY_TIMEOUT_MS: '5000'
      AGENT_ROOM_CONTENT_S3_ENDPOINT: ${AGENT_ROOM_CONTENT_S3_ENDPOINT}
      AGENT_ROOM_CONTENT_S3_BUCKET: ${AGENT_ROOM_CONTENT_S3_BUCKET}
      AGENT_ROOM_CONTENT_S3_REGION: ${AGENT_ROOM_CONTENT_S3_REGION}
      AGENT_ROOM_CONTENT_S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      AGENT_ROOM_CONTENT_S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      AGENT_ROOM_CONTENT_S3_TIMEOUT_MS: '30000'
      AGENT_ROOM_CONTENT_SCANNER_ADDRESS: content-scanner:3310
      AGENT_ROOM_CONTENT_SCANNER_CONNECT_TIMEOUT_MS: '3000'
      AGENT_ROOM_CONTENT_SCANNER_TIMEOUT_MS: '60000'
      AGENT_ROOM_CONTENT_TICKET_KEY_ID: production-v1
      AGENT_ROOM_CONTENT_TICKET_SECRET_FILE: /run/secrets/content_ticket_secret
      AGENT_ROOM_CONTENT_MATRIX_AGENT_ID: ${AGENT_ROOM_CONTENT_MATRIX_AGENT_ID}
      AGENT_ROOM_OIDC_ISSUER_URL: https://${AGENT_ROOM_IDENTITY_DOMAIN}/realms/agent-room
      AGENT_ROOM_OIDC_CLIENT_ID: agent-room-web
      AGENT_ROOM_OIDC_DEVICE_CLIENT_ID: agent-room-bridge
      AGENT_ROOM_OIDC_CLIENT_SECRET_FILE: /run/secrets/keycloak_web_client_secret
      AGENT_ROOM_OIDC_REDIRECT_URL: https://${AGENT_ROOM_APP_DOMAIN}${AGENT_ROOM_BROWSER_OIDC_CALLBACK_PATH}
      AGENT_ROOM_FRONTEND_ORIGIN: https://${AGENT_ROOM_APP_DOMAIN}
      AGENT_ROOM_DESKTOP_ORIGIN: http://tauri.localhost,tauri://localhost
      AGENT_ROOM_MATRIX_SERVER_NAME: ${AGENT_ROOM_SERVER_NAME}
      AGENT_ROOM_OTLP_TRACES_ENDPOINT: ${AGENT_ROOM_OTLP_TRACES_ENDPOINT:-}
      AGENT_ROOM_OTLP_METRICS_ENDPOINT: ${AGENT_ROOM_OTLP_METRICS_ENDPOINT:-}
      AGENT_ROOM_OPERATIONAL_METRICS_INTERVAL_MS: '15000'
      AGENT_ROOM_OTEL_EXPORT_TIMEOUT_MS: '5000'
      AGENT_ROOM_LOG_FILTER: agent_room_control_plane=info,sqlx=warn
      AGENT_ROOM_NETWORK_AGENTS_ENABLED: ${AGENT_ROOM_NETWORK_AGENTS_ENABLED:-false}
      AGENT_ROOM_NETWORK_AGENT_SEAL_KEY_FILE: /run/secrets/network_agent_seal_key
      AGENT_ROOM_PUBLIC_API_ORIGIN: https://${AGENT_ROOM_API_DOMAIN}
      AGENT_ROOM_NETWORK_AGENT_STORE_DIR: /var/lib/agent-room/network-agents
    # 网络 Agent 的 matrix-sdk 加密存储（第 3 步）。不做文件级备份：丢了凭封存的恢复密钥重建。
    volumes:
      - ${AGENT_ROOM_STATE_DIR}/data/network-agents:/var/lib/agent-room/network-agents
    secrets:
      - agent_room_db_runtime_password
      - account_deletion_receipt_secret
      - network_agent_seal_key
      - content_ticket_secret
      - keycloak_web_client_secret
      - keycloak_account_admin_client_secret
      - s3_access_key
      - s3_secret_key
      - synapse_appservice_token
      - synapse_lifecycle_admin_token
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:8090/health/ready]
      interval: 10s
      timeout: 5s
      retries: 60
    deploy:
      replicas: ${AGENT_ROOM_CONTROL_PLANE_REPLICAS:-1}
    read_only: true
    restart: unless-stopped
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    networks: [backend]

  gateway:
    logging: *container-logging
    build:
      context: ../..
      dockerfile: infra/production/Containerfile.web
      args:
        VITE_AGENT_ROOM_CONTROL_PLANE_URL: https://${AGENT_ROOM_APP_DOMAIN}${AGENT_ROOM_BROWSER_CONTROL_PLANE_PATH_PREFIX}
        VITE_AGENT_ROOM_IDENTITY_REGISTRATION_MODE: ${AGENT_ROOM_IDENTITY_REGISTRATION_MODE:-closed}
        VITE_AGENT_ROOM_MATRIX_HOMESERVER_URL: https://${AGENT_ROOM_MATRIX_DOMAIN}
        VITE_AGENT_ROOM_WINDOWS_DOWNLOAD_URL: ${AGENT_ROOM_WINDOWS_DOWNLOAD_URL:-}
        VITE_AGENT_ROOM_MACOS_DOWNLOAD_URL: ${AGENT_ROOM_MACOS_DOWNLOAD_URL:-}
    ports:
      - 80:80
      - 443:443
    labels:
      org.agent-room.generated-config-digest: ${AGENT_ROOM_GENERATED_CONFIG_DIGEST:?缺少生成配置摘要}
    volumes:
      - ${AGENT_ROOM_STATE_DIR}/generated/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${AGENT_ROOM_STATE_DIR}/data/caddy-data:/data
      - ${AGENT_ROOM_STATE_DIR}/data/caddy-config:/config
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks:
      backend:
        aliases:
          - ${AGENT_ROOM_SERVER_NAME}
          - ${AGENT_ROOM_APP_DOMAIN}
          - ${AGENT_ROOM_API_DOMAIN}
          - ${AGENT_ROOM_MATRIX_DOMAIN}
          - ${AGENT_ROOM_IDENTITY_DOMAIN}

networks:
  backend:
    driver: bridge
    internal: false

secrets:
  postgres_bootstrap_password:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/postgres_bootstrap_password
  agent_room_db_migration_password:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/agent_room_db_migration_password
  agent_room_db_runtime_password:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/agent_room_db_runtime_password
  postgres_metrics_password:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/postgres_metrics_password
  synapse_db_password:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/synapse_db_password
  keycloak_db_password:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/keycloak_db_password
  keycloak_admin_password:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/keycloak_admin_password
  keycloak_web_client_secret:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/keycloak_web_client_secret
  keycloak_account_admin_client_secret:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/keycloak_account_admin_client_secret
  synapse_appservice_token:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/synapse_appservice_token
  synapse_registration_secret:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/synapse_registration_secret
  synapse_lifecycle_admin_password:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/synapse_lifecycle_admin_password
  synapse_lifecycle_admin_token:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/synapse_lifecycle_admin_token
  s3_access_key:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/s3_access_key
  s3_secret_key:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/s3_secret_key
  content_ticket_secret:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/content_ticket_secret
  account_deletion_receipt_secret:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/account_deletion_receipt_secret
  network_agent_seal_key:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/network_agent_seal_key
  migration_database_url:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/migration_database_url
  alertmanager_webhook_token:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/alertmanager_webhook_token
  grafana_admin_password:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/grafana_admin_password
  identity_smtp_password:
    file: ${AGENT_ROOM_STATE_DIR}/secrets/identity_smtp_password

volumes:
  alertmanager-data:
  grafana-data:
  prometheus-data:
