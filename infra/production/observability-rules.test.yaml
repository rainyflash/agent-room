rule_files:
  - observability-rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: agent_room_api_server_requests_total{http_response_status_code="200"}
        values: 0+80x40
      - series: agent_room_api_server_requests_total{http_response_status_code="500"}
        values: 0+20x40
      - series: agent_room_api_server_duration_seconds_bucket{le="0.5"}
        values: 0+1x40
      - series: agent_room_api_server_duration_seconds_bucket{le="1"}
        values: 0+10x40
      - series: agent_room_api_server_duration_seconds_bucket{le="+Inf"}
        values: 0+10x40
    alert_rule_test:
      - eval_time: 20m
        alertname: AgentRoomApiAvailabilityFastBurn
        exp_alerts:
          - exp_labels: { severity: critical, service: agent-room }
            exp_annotations:
              summary: 控制平面 API 正在快速消耗错误预算
              impact: 用户登录、状态同步或消息操作可能失败
              diagnostic: 检查控制平面 5xx、依赖可用性与数据库连接池
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroomapiavailabilityfastburn
      - eval_time: 20m
        alertname: AgentRoomApiLatencyHigh
        exp_alerts:
          - exp_labels: { severity: warning, service: agent-room }
            exp_annotations:
              summary: 控制平面 API P95 延迟持续超过 800ms
              impact: 大厅、私信与状态操作出现可感知卡顿
              diagnostic: 对照数据库、Matrix、对象存储依赖探测耗时
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroomapilatencyhigh
  # 公开大厅满了的 503 不算服务出错，只响“公开大厅满了”；只有网络 Agent 的长轮询慢时不算延迟高。
  - interval: 1m
    input_series:
      - series: agent_room_api_server_requests_total{http_response_status_code="200"}
        values: 0+80x40
      - series: agent_room_api_server_requests_total{http_response_status_code="503",refusal="lobby_full"}
        values: 0+20x40
      - series: agent_room_api_server_duration_seconds_bucket{le="0.5"}
        values: 0+80x40
      - series: agent_room_api_server_duration_seconds_bucket{le="1"}
        values: 0+80x40
      - series: agent_room_api_server_duration_seconds_bucket{le="+Inf"}
        values: 0+80x40
      - series: agent_room_api_server_duration_seconds_bucket{http_route="/v1/network-agents/me/messages",http_request_method="GET",le="0.5"}
        values: 0+0x40
      - series: agent_room_api_server_duration_seconds_bucket{http_route="/v1/network-agents/me/messages",http_request_method="GET",le="1"}
        values: 0+0x40
      - series: agent_room_api_server_duration_seconds_bucket{http_route="/v1/network-agents/me/messages",http_request_method="GET",le="+Inf"}
        values: 0+200x40
    alert_rule_test:
      - eval_time: 20m
        alertname: AgentRoomApiAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 20m
        alertname: AgentRoomApiLatencyHigh
        exp_alerts: []
      - eval_time: 8m
        alertname: AgentRoomPublicLobbyFull
        exp_alerts: []
      - eval_time: 20m
        alertname: AgentRoomPublicLobbyFull
        exp_alerts:
          - exp_labels: { severity: warning, service: agent-room }
            exp_annotations:
              summary: 公开大厅里的网络 Agent 满了
              impact: 新来的网络 Agent 进不了公开大厅，收到 capacity_reached；私人房间不受影响
              diagnostic: 看服务器负载和大厅里的网络 Agent 数，决定要不要调高 networkAgents.limits.maxLobbyAgents
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroompubliclobbyfull
  # 发信：失败一封就提醒；最近 24 小时成功发了 80 封提醒额度快用完。
  - interval: 1m
    input_series:
      - series: keycloak_user_events_total{realm="agent-room",event="send_verify_email",error=""}
        values: 0+2x60
      - series: keycloak_user_events_total{realm="agent-room",event="send_reset_password",error=""}
        values: 0+1x60
      - series: keycloak_user_events_total{realm="agent-room",event="send_verify_email",error="email_send_failed"}
        values: 0x30 1+0x30
      - series: keycloak_user_events_total{realm="agent-room",event="login",error=""}
        values: 0+50x60
    alert_rule_test:
      - eval_time: 20m
        alertname: AgentRoomEmailSendFailed
        exp_alerts: []
      - eval_time: 33m
        alertname: AgentRoomEmailSendFailed
        exp_alerts:
          - exp_labels: { severity: warning, service: agent-room }
            exp_annotations:
              summary: 有验证信或重设密码信发不出去
              impact: 刚注册的人收不到验证信、忘了密码的人收不到重设信；登录页让他们过几个小时再试
              diagnostic: 看 Keycloak 日志里的发信错误和 Resend 后台的当天用量；额度用完要等 UTC 零点
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroomemailsendfailed
      - eval_time: 20m
        alertname: AgentRoomEmailQuotaNearlyUsed
        exp_alerts: []
      - eval_time: 30m
        alertname: AgentRoomEmailQuotaNearlyUsed
        exp_alerts:
          - exp_labels: { severity: info, service: agent-room }
            exp_annotations:
              summary: 最近 24 小时已经发了 80 封邮件，快到 Resend 每天 100 封的额度了
              impact: 额度用完以后注册和重设密码的邮件都发不出去，到 UTC 零点才恢复
              diagnostic: 看注册是不是被刷了（同一来源大量注册）；被刷时按首发预案临时关注册
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroomemailquotanearlyused
  # Keycloak 起来以后头一次发信失败：失败计数一出现就是 1，没涨过也要响；十分钟以后不再响。
  - interval: 1m
    input_series:
      - series: up{job="keycloak"}
        values: 1+0x60
      - series: keycloak_user_events_total{realm="agent-room",event="send_verify_email",error=""}
        values: 0+2x60
      - series: keycloak_user_events_total{realm="agent-room",event="send_verify_email_error",error="email_send_failed"}
        values: _x30 1+0x30
    alert_rule_test:
      - eval_time: 29m
        alertname: AgentRoomEmailSendFailed
        exp_alerts: []
      - eval_time: 32m
        alertname: AgentRoomEmailSendFailed
        exp_alerts:
          - exp_labels: { severity: warning, service: agent-room }
            exp_annotations:
              summary: 有验证信或重设密码信发不出去
              impact: 刚注册的人收不到验证信、忘了密码的人收不到重设信；登录页让他们过几个小时再试
              diagnostic: 看 Keycloak 日志里的发信错误和 Resend 后台的当天用量；额度用完要等 UTC 零点
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroomemailsendfailed
      - eval_time: 45m
        alertname: AgentRoomEmailSendFailed
        exp_alerts: []
  # 监控自己停过一阵（或者刚开起来）：Keycloak 早就有的失败计数不算新的，不再报一次。
  - interval: 1m
    input_series:
      - series: up{job="keycloak"}
        values: 1x10 _x10 1x40
      - series: keycloak_user_events_total{realm="agent-room",event="send_verify_email_error",error="email_send_failed"}
        values: 1x10 _x10 1x40
    alert_rule_test:
      - eval_time: 5m
        alertname: AgentRoomEmailSendFailed
        exp_alerts: []
      - eval_time: 27m
        alertname: AgentRoomEmailSendFailed
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: agent_room_dependency_available{dependency="matrix"}
        values: 0+0x20
    alert_rule_test:
      - eval_time: 12m
        alertname: AgentRoomDependencyUnavailable
        exp_alerts:
          - exp_labels: { dependency: matrix, severity: critical, service: agent-room }
            exp_annotations:
              summary: 控制平面核心依赖不可用
              impact: 依赖相关业务路径会失败关闭
              diagnostic: 按 dependency 标签检查 PostgreSQL、Matrix、OIDC 或对象存储
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroomdependencyunavailable
  - interval: 1m
    input_series:
      - series: probe_success{instance="matrix",job="endpoint-probes"}
        values: 0+0x20
      - series: probe_success{instance="federation-version",job="endpoint-probes"}
        values: 0+0x20
    alert_rule_test:
      - eval_time: 10m
        alertname: AgentRoomCoreEndpointUnavailable
        exp_alerts:
          - exp_labels:
              { instance: matrix, job: endpoint-probes, severity: critical, service: agent-room }
            exp_annotations:
              summary: 核心服务端点不可达
              impact: 对应核心能力对用户不可用
              diagnostic: 按 instance 标签检查容器健康、网络和上游日志
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroomcoreendpointunavailable
      - eval_time: 10m
        alertname: AgentRoomFederationEndpointUnavailable
        exp_alerts:
          - exp_labels:
              {
                instance: federation-version,
                job: endpoint-probes,
                severity: critical,
                service: agent-room,
              }
            exp_annotations:
              summary: Matrix 联邦公开入口不可达
              impact: 其他 homeserver 无法发现或连接本站
              diagnostic: 检查 well-known、TLS、DNS 与 federation version 入口
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroomfederationendpointunavailable
  # 桌面端开着时每 15 分钟报一次这段时间连着的比例（0 到 1）。这里一分钟一条，像十几台桌面端都开着、
  # 平均一半时间没连上。
  - interval: 1m
    input_series:
      - series: agent_room_frontend_score_sum{metric="bridge_uptime",surface="desktop"}
        values: 0+0.5x120
      - series: agent_room_frontend_score_count{metric="bridge_uptime",surface="desktop"}
        values: 0+1x120
    alert_rule_test:
      - eval_time: 80m
        alertname: AgentRoomBridgeAvailabilityLow
        exp_alerts:
          - exp_labels: { severity: warning, service: agent-room }
            exp_annotations:
              summary: 桌面 Bridge 群体可用率低于 95%
              impact: Agent 状态上报和本机消息投递可能中断
              diagnostic: 检查 Bridge 版本、认证与重连时延聚合指标
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroombridgeavailabilitylow
  # 一小时里样本太少（只有一台开了一会儿）不算数；之后没人开着桌面端、没有新样本，也不算可用率低。
  # 旧版客户端按状态变化报的 bridge_availability 不进这条告警：每次启动先报一个“正在启动”，比例到不了一半。
  - interval: 1m
    input_series:
      - series: agent_room_frontend_score_sum{metric="bridge_uptime",surface="desktop"}
        values: 0x120
      - series: agent_room_frontend_score_count{metric="bridge_uptime",surface="desktop"}
        values: 0x10 1x110
      - series: agent_room_frontend_score_sum{metric="bridge_availability",surface="desktop"}
        values: 0x120
      - series: agent_room_frontend_score_count{metric="bridge_availability",surface="desktop"}
        values: 0+10x120
    alert_rule_test:
      - eval_time: 40m
        alertname: AgentRoomBridgeAvailabilityLow
        exp_alerts: []
      - eval_time: 115m
        alertname: AgentRoomBridgeAvailabilityLow
        exp_alerts: []
  # 两个核里一个吃满、另一个闲一半（整机 75%）：一小时以后才响。
  - interval: 1m
    input_series:
      - series: node_cpu_seconds_total{job="host",cpu="0",mode="idle"}
        values: 0+30x120
      - series: node_cpu_seconds_total{job="host",cpu="1",mode="idle"}
        values: 0+0x120
    alert_rule_test:
      - eval_time: 40m
        alertname: AgentRoomHostCpuHigh
        exp_alerts: []
      - eval_time: 80m
        alertname: AgentRoomHostCpuHigh
        exp_alerts:
          - exp_labels: { severity: warning, service: agent-room }
            exp_annotations:
              summary: 服务器 CPU 一小时以上都在 50% 以上
              impact: 余量变小，Synapse 只用得满一个核，人一多消息就会变慢
              diagnostic: 在服务器上用 top 看是哪个进程；是 dockerd 就照 Runbook 查有没有卡住的日志读者
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroomhostcpuhigh
  # 平时（13% 上下）不响；吃满半小时又降下来（比如病毒库更新）也不响。
  - interval: 1m
    input_series:
      - series: node_cpu_seconds_total{job="host",cpu="0",mode="idle"}
        values: 0+52x120
      - series: node_cpu_seconds_total{job="host",cpu="1",mode="idle"}
        values: 0+52x120
    alert_rule_test:
      - eval_time: 110m
        alertname: AgentRoomHostCpuHigh
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: node_cpu_seconds_total{job="host",cpu="0",mode="idle"}
        values: 0+0x30 0+60x90
      - series: node_cpu_seconds_total{job="host",cpu="1",mode="idle"}
        values: 0+0x30 0+60x90
    alert_rule_test:
      - eval_time: 70m
        alertname: AgentRoomHostCpuHigh
        exp_alerts: []
      - eval_time: 110m
        alertname: AgentRoomHostCpuHigh
        exp_alerts: []
  # 根目录剩 15 GiB：半小时以后报“不到 20 GiB”，不报“不到 8 GiB”。
  - interval: 1m
    input_series:
      - series: node_filesystem_avail_bytes{job="host",device="/dev/sda",fstype="ext4",mountpoint="/"}
        values: 16106127360+0x60
    alert_rule_test:
      - eval_time: 20m
        alertname: AgentRoomDiskSpaceLow
        exp_alerts: []
      - eval_time: 40m
        alertname: AgentRoomDiskSpaceLow
        exp_alerts:
          - exp_labels: { severity: warning, service: agent-room }
            exp_annotations:
              summary: 服务器根目录剩下不到 20 GiB
              impact: 下次发版的部署预检过不了；再少下去数据库和备份会写不进去
              diagnostic: 用 du 看是备份仓库、Docker 镜像、容器日志还是旧发布目录在长；别手动截短容器日志
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroomdiskspacelow
      - eval_time: 40m
        alertname: AgentRoomDiskSpaceCritical
        exp_alerts: []
  # 剩 5 GiB：五分钟以后报“不到 8 GiB”。
  - interval: 1m
    input_series:
      - series: node_filesystem_avail_bytes{job="host",device="/dev/sda",fstype="ext4",mountpoint="/"}
        values: 5368709120+0x20
    alert_rule_test:
      - eval_time: 10m
        alertname: AgentRoomDiskSpaceCritical
        exp_alerts:
          - exp_labels: { severity: critical, service: agent-room }
            exp_annotations:
              summary: 服务器根目录剩下不到 8 GiB
              impact: PostgreSQL、WAL 归档和备份随时会写满，服务会停
              diagnostic: 马上照 Runbook 腾地方，先动能重来的（旧镜像、旧发布目录、超过保留期的恢复演练），备份最后动
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroomdiskspacecritical
  # 根目录剩 25 GiB 不报；别的挂载点（/run 这类 tmpfs）小也不算。
  - interval: 1m
    input_series:
      - series: node_filesystem_avail_bytes{job="host",device="/dev/sda",fstype="ext4",mountpoint="/"}
        values: 26843545600+0x60
      - series: node_filesystem_avail_bytes{job="host",device="tmpfs",fstype="tmpfs",mountpoint="/run"}
        values: 5242880+0x60
    alert_rule_test:
      - eval_time: 50m
        alertname: AgentRoomDiskSpaceLow
        exp_alerts: []
      - eval_time: 50m
        alertname: AgentRoomDiskSpaceCritical
        exp_alerts: []
  # 可用内存一直只有 300 MiB：响。
  - interval: 1m
    input_series:
      - series: node_memory_MemAvailable_bytes{job="host"}
        values: 314572800+0x60
      - series: node_pressure_memory_stalled_seconds_total{job="host"}
        values: 0+0x60
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRoomMemoryLow
        exp_alerts:
          - exp_labels: { severity: warning, service: agent-room }
            exp_annotations:
              summary: 服务器可用内存长时间不够
              impact: 服务在换页里变慢，再紧就会有进程被内核杀掉
              diagnostic: 用 docker stats 和每个进程的 VmSwap 看是谁占着；先看 ClamAV 和身份服务
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroommemorylow
  # 平时 1.7 GiB，ClamAV 重载病毒库掉到 400 MiB 五分钟：不响。
  - interval: 1m
    input_series:
      - series: node_memory_MemAvailable_bytes{job="host"}
        values: 1800000000+0x30 420000000+0x5 1800000000+0x30
      - series: node_pressure_memory_stalled_seconds_total{job="host"}
        values: 0+0x66
    alert_rule_test:
      - eval_time: 40m
        alertname: AgentRoomMemoryLow
        exp_alerts: []
      - eval_time: 60m
        alertname: AgentRoomMemoryLow
        exp_alerts: []
  # 可用内存还有 1 GiB，可两成的时间所有进程都卡在内存上（在换页里打转）：响。
  - interval: 1m
    input_series:
      - series: node_memory_MemAvailable_bytes{job="host"}
        values: 1073741824+0x60
      - series: node_pressure_memory_stalled_seconds_total{job="host"}
        values: 0+12x60
    alert_rule_test:
      - eval_time: 10m
        alertname: AgentRoomMemoryLow
        exp_alerts: []
      - eval_time: 30m
        alertname: AgentRoomMemoryLow
        exp_alerts:
          - exp_labels: { severity: warning, service: agent-room }
            exp_annotations:
              summary: 服务器可用内存长时间不够
              impact: 服务在换页里变慢，再紧就会有进程被内核杀掉
              diagnostic: 用 docker stats 和每个进程的 VmSwap 看是谁占着；先看 ClamAV 和身份服务
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroommemorylow
  # 开机以来杀过 3 次、这段时间没再杀：不响。第 11 分钟杀了一次：马上响，半小时后不再响。
  - interval: 1m
    input_series:
      - series: node_vmstat_oom_kill{job="host"}
        values: 3+0x10 4+0x40
    alert_rule_test:
      - eval_time: 10m
        alertname: AgentRoomOomKill
        exp_alerts: []
      - eval_time: 15m
        alertname: AgentRoomOomKill
        exp_alerts:
          - exp_labels: { severity: critical, service: agent-room }
            exp_annotations:
              summary: 服务器上有进程因为内存不够被内核杀了
              impact: 被杀的服务会重启，重启那一会儿相关的功能用不了
              diagnostic: 用 journalctl -k 找 oom-kill 那一行，看杀的是哪个进程、当时谁占内存最多
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroomoomkill
      - eval_time: 50m
        alertname: AgentRoomOomKill
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: up{job="postgres"}
        values: 0+0x20
    alert_rule_test:
      - eval_time: 12m
        alertname: AgentRoomPostgresExporterDown
        exp_alerts:
          - exp_labels: { job: postgres, severity: critical, service: agent-room }
            exp_annotations:
              summary: PostgreSQL 指标采集失败
              impact: 数据库容量与连接故障变为不可观测
              diagnostic: 检查指标专用角色、TLS 和 exporter 容器
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroompostgresexporterdown
  - interval: 1m
    input_series:
      - series: up{job="control-plane-otel"}
        values: 1+0x5 0+0x20
    alert_rule_test:
      - eval_time: 8m
        alertname: AgentRoomTelemetryCollectorDown
        exp_alerts: []
      - eval_time: 14m
        alertname: AgentRoomTelemetryCollectorDown
        exp_alerts:
          - exp_labels: { job: control-plane-otel, severity: critical, service: agent-room }
            exp_annotations:
              summary: 指标收集器采不到了
              impact: 控制面的请求、延迟和发信这些指标都断了，靠它们的告警不会再响
              diagnostic: 看 telemetry 容器在不在跑、日志里有没有报错、内存是不是顶在上限
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroomtelemetrycollectordown
  - interval: 1m
    input_series:
      - series: agent_room_backup_last_success_timestamp_seconds
        values: 0+0x40
      - series: agent_room_backup_rpo_target_seconds
        values: 900+0x40
    alert_rule_test:
      - eval_time: 25m
        alertname: AgentRoomBackupRpoBreached
        exp_alerts:
          - exp_labels: { severity: critical, service: agent-room }
            exp_annotations:
              summary: 最近成功备份已超过 RPO
              impact: 故障时的数据丢失窗口超过承诺值
              diagnostic: 检查定时器、备份仓库空间和 PostgreSQL 归档
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroombackuprpobreached
  - interval: 1m
    input_series:
      - series: agent_room_backup_last_full_timestamp_seconds
        values: 0+0x1700
    alert_rule_test:
      - eval_time: 26h20m
        alertname: AgentRoomBackupFullStale
        exp_alerts: []
      - eval_time: 27h
        alertname: AgentRoomBackupFullStale
        exp_alerts:
          - exp_labels: { severity: warning, service: agent-room }
            exp_annotations:
              summary: 超过 26 小时没有新的全量备份
              impact: 恢复要从更早的全量重放更多 WAL，恢复时间变长
              diagnostic: 检查 UTC 零点后第一次定时备份的日志、磁盘余量和逻辑导出
              runbook_url: https://github.com/rainyflash/agent-room/blob/main/docs/operations/observability.md#agentroombackupfullstale
  - interval: 1m
    input_series:
      - series: agent_room_restore_drill_last_success_timestamp_seconds
        values: 0+0x10300
    alert_rule_test:
      - eval_time: 170h
        alertname: AgentRoomRestoreDrillStale
        exp_alerts:
          - exp_labels: { severity: warning, service: agent-room }
            exp_annotations:
