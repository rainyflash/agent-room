groups:
  - name: agent-room-slo-recording
    interval: 1m
    rules:
      - record: agent_room:api_request_rate:sum_5m
        expr: sum(rate(agent_room_api_server_requests_total[5m]))
      - record: agent_room:api_availability:ratio_5m
        expr: 1 - (sum(rate(agent_room_api_server_requests_total{http_response_status_code=~"5.."}[5m])) / clamp_min(sum(rate(agent_room_api_server_requests_total[5m])), 0.000001))
      - record: agent_room:api_availability:ratio_30d
        expr: 1 - (sum(rate(agent_room_api_server_requests_total{http_response_status_code=~"5.."}[30d])) / clamp_min(sum(rate(agent_room_api_server_requests_total[30d])), 0.000001))
      - record: agent_room:api_latency:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(agent_room_api_server_duration_seconds_bucket[5m])))
      - record: agent_room:api_error_budget_remaining:ratio_30d
        expr: clamp_max(clamp_min((agent_room:api_availability:ratio_30d - 0.999) / 0.001, 1), 0)

  - name: agent-room-actionable-alerts
    interval: 1m
    rules:
      - alert: AgentRoomApiAvailabilityFastBurn
        expr: agent_room:api_request_rate:sum_5m > 0 and (1 - agent_room:api_availability:ratio_5m) > 0.0144
        for: 2m
        labels:
          severity: critical
          service: agent-room
        annotations:
          summary: 控制平面 API 正在快速消耗错误预算
          impact: 用户登录、状态同步或消息操作可能失败
          diagnostic: 检查控制平面 5xx、依赖可用性与数据库连接池
          runbook_url: https://github.com/agent-room/agent-room/blob/main/docs/operations/observability.md#agentroomapiavailabilityfastburn
      - alert: AgentRoomApiLatencyHigh
        expr: agent_room:api_request_rate:sum_5m > 0 and agent_room:api_latency:p95_5m > 0.8
        for: 10m
        labels:
          severity: warning
          service: agent-room
        annotations:
          summary: 控制平面 API P95 延迟持续超过 800ms
          impact: 大厅、私信与状态操作出现可感知卡顿
          diagnostic: 对照数据库、Matrix、对象存储依赖探测耗时
          runbook_url: https://github.com/agent-room/agent-room/blob/main/docs/operations/observability.md#agentroomapilatencyhigh
      - alert: AgentRoomDependencyUnavailable
        expr: min_over_time(agent_room_dependency_available[5m]) < 1
        for: 5m
        labels:
          severity: critical
          service: agent-room
        annotations:
          summary: 控制平面核心依赖不可用
          impact: 依赖相关业务路径会失败关闭
          diagnostic: 按 dependency 标签检查 PostgreSQL、Matrix、OIDC 或对象存储
          runbook_url: https://github.com/agent-room/agent-room/blob/main/docs/operations/observability.md#agentroomdependencyunavailable
      - alert: AgentRoomOutboxBacklog
        expr: agent_room_operational_value{metric="outbox_pending"} > 1000 or agent_room_operational_age_seconds{metric="outbox_oldest_pending"} > 300
        for: 10m
        labels:
          severity: warning
          service: agent-room
        annotations:
          summary: Outbox 发布持续积压
          impact: 控制平面已接受的变更不能及时投影到 Matrix
          diagnostic: 检查发布进程、Matrix 可用性与最旧待发布年龄
          runbook_url: https://github.com/agent-room/agent-room/blob/main/docs/operations/observability.md#agentroomoutboxbacklog
      - alert: AgentRoomOutboxDeadLetters
        expr: agent_room_operational_value{metric="outbox_dead_lettered"} > 0
        for: 5m
        labels:
          severity: critical
          service: agent-room
        annotations:
          summary: Outbox 出现死信
          impact: 至少一个业务事件已停止自动发布
          diagnostic: 按 Runbook 查询结构化日志并执行受控重放
          runbook_url: https://github.com/agent-room/agent-room/blob/main/docs/operations/observability.md#agentroomoutboxdeadletters
      - alert: AgentRoomProjectionStalled
        expr: agent_room_operational_value{metric="projection_unhealthy"} > 0 or agent_room_operational_age_seconds{metric="projection_oldest_update"} > 120
        for: 5m
        labels:
          severity: critical
          service: agent-room
        annotations:
          summary: Matrix 投影停滞或不健康
          impact: 大厅和成员状态可能不再反映权威事件
          diagnostic: 检查投影游标、Matrix 同步与重建工具
          runbook_url: https://github.com/agent-room/agent-room/blob/main/docs/operations/observability.md#agentroomprojectionstalled
      - alert: AgentRoomCoreEndpointUnavailable
        expr: probe_success{instance=~"control-plane|matrix|oidc|object-store|web"} == 0
        for: 2m
        labels:
          severity: critical
          service: agent-room
        annotations:
          summary: 核心服务端点不可达
          impact: 对应核心能力对用户不可用
          diagnostic: 按 instance 标签检查容器健康、网络和上游日志
          runbook_url: https://github.com/agent-room/agent-room/blob/main/docs/operations/observability.md#agentroomcoreendpointunavailable
      - alert: AgentRoomFederationEndpointUnavailable
        expr: probe_success{instance=~"federation-.*"} == 0
        for: 5m
        labels:
          severity: critical
          service: agent-room
        annotations:
          summary: Matrix 联邦公开入口不可达
          impact: 其他 homeserver 无法发现或连接本站
          diagnostic: 检查 well-known、TLS、DNS 与 federation version 入口
          runbook_url: https://github.com/agent-room/agent-room/blob/main/docs/operations/observability.md#agentroomfederationendpointunavailable
      - alert: AgentRoomBridgeAvailabilityLow
        expr: sum(rate(agent_room_frontend_score_sum{metric="bridge_availability"}[15m])) / clamp_min(sum(rate(agent_room_frontend_score_count{metric="bridge_availability"}[15m])), 0.000001) < 0.95
        for: 15m
        labels:
          severity: warning
          service: agent-room
        annotations:
          summary: 桌面 Bridge 群体可用率低于 95%
          impact: Agent 状态上报和本机消息投递可能中断
          diagnostic: 检查 Bridge 版本、认证与重连时延聚合指标
          runbook_url: https://github.com/agent-room/agent-room/blob/main/docs/operations/observability.md#agentroombridgeavailabilitylow
      - alert: AgentRoomPostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 5m
        labels:
          severity: critical
          service: agent-room
        annotations:
          summary: PostgreSQL 指标采集失败
          impact: 数据库容量与连接故障变为不可观测
          diagnostic: 检查指标专用角色、TLS 和 exporter 容器
          runbook_url: https://github.com/agent-room/agent-room/blob/main/docs/operations/observability.md#agentroompostgresexporterdown
      - alert: AgentRoomBackupRpoBreached
        expr: time() - agent_room_backup_last_success_timestamp_seconds > agent_room_backup_rpo_target_seconds
        for: 5m
        labels:
          severity: critical
          service: agent-room
        annotations:
          summary: 最近成功备份已超过 RPO
          impact: 故障时的数据丢失窗口超过承诺值
          diagnostic: 检查定时器、备份仓库空间和 PostgreSQL 归档
          runbook_url: https://github.com/agent-room/agent-room/blob/main/docs/operations/observability.md#agentroombackuprpobreached
      - alert: AgentRoomRestoreDrillStale
        expr: time() - agent_room_restore_drill_last_success_timestamp_seconds > 604800
        for: 30m
        labels:
          severity: warning
          service: agent-room
        annotations:
          summary: 一周内没有成功恢复演练
          impact: 备份可恢复性已经失去新鲜证据
          diagnostic: 运行隔离恢复演练并核对签名证据
          runbook_url: https://github.com/agent-room/agent-room/blob/main/docs/operations/observability.md#agentroomrestoredrillstale
      - alert: AgentRoomRestoreRtoExceeded
        expr: agent_room_restore_drill_duration_seconds > agent_room_restore_rto_target_seconds
        for: 5m
        labels:
          severity: warning
          service: agent-room
        annotations:
          summary: 最近恢复演练超过 RTO
          impact: 真实灾难恢复可能无法按目标时间完成
          diagnostic: 分解数据库、对象和身份恢复阶段耗时
          runbook_url: https://github.com/agent-room/agent-room/blob/main/docs/operations/observability.md#agentroomrestorertoexceeded
