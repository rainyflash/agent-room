name: agent-room-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?缺少 POSTGRES_BOOTSTRAP_PASSWORD}
      POSTGRES_USER: agent_room_bootstrap
      AGENT_ROOM_DB_PASSWORD: ${AGENT_ROOM_DB_PASSWORD:?缺少 AGENT_ROOM_DB_PASSWORD}
      AGENT_ROOM_DB_RUNTIME_PASSWORD: ${AGENT_ROOM_DB_RUNTIME_PASSWORD:?缺少 AGENT_ROOM_DB_RUNTIME_PASSWORD}
      SYNAPSE_DB_PASSWORD: ${SYNAPSE_DB_PASSWORD:?缺少 SYNAPSE_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?缺少 KEYCLOAK_DB_PASSWORD}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ${AGENT_ROOM_ROOT:?缺少 AGENT_ROOM_ROOT}/infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent_room_bootstrap -d postgres']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  synapse:
    image: matrixdotorg/synapse:v1.159.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:18008:8008'
    volumes:
      - ${AGENT_ROOM_LOCAL_DIR:?缺少 AGENT_ROOM_LOCAL_DIR}/generated/synapse:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8008/_matrix/client/versions'', timeout=2)"',
        ]
      interval: 5s
      timeout: 4s
      retries: 40
    restart: unless-stopped

  identity:
    image: quay.io/keycloak/keycloak:26.7.2
    command: ['start-dev', '--import-realm', '--health-enabled=true']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: identity
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?缺少 KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?缺少 KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?缺少 KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
    ports:
      - '127.0.0.1:18080:8080'
      - '127.0.0.1:19000:9000'
    volumes:
      - ${AGENT_ROOM_LOCAL_DIR:?缺少 AGENT_ROOM_LOCAL_DIR}/generated/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 4s
      retries: 60
    restart: unless-stopped

  object-store:
    image: ghcr.io/chrislusf/seaweedfs:4.44
    command:
      ['server', '-s3', '-dir=/data', '-ip.bind=0.0.0.0', '-s3.config=/etc/seaweedfs/s3.json']
    ports:
      - '127.0.0.1:18333:8333'
      - '127.0.0.1:18888:8888'
      - '127.0.0.1:19333:9333'
    volumes:
      - object-data:/data
      - ${AGENT_ROOM_LOCAL_DIR:?缺少 AGENT_ROOM_LOCAL_DIR}/generated/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  content-scanner:
    image: clamav/clamav:1.5.4
    ports:
      - '127.0.0.1:13310:3310'
    volumes:
      - clamav-data:/var/lib/clamav
      - ${AGENT_ROOM_ROOT:?缺少 AGENT_ROOM_ROOT}/infra/clamav/agent-room-test.ndb:/var/lib/clamav/agent-room-test.ndb
    restart: unless-stopped

  mail:
    image: axllent/mailpit:v1.31.0
    environment:
      MP_MAX_MESSAGES: '500'
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:11025:1025'
      - '127.0.0.1:18025:8025'
    restart: unless-stopped

  telemetry:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ['--config=/etc/otelcol/config.yaml']
    ports:
      - '127.0.0.1:14317:4317'
      - '127.0.0.1:14318:4318'
      - '127.0.0.1:13134:13133'
    volumes:
      - ${AGENT_ROOM_ROOT:?缺少 AGENT_ROOM_ROOT}/infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped

  gateway:
    image: caddy:2.11.4-alpine
    depends_on:
      identity:
        condition: service_healthy
      synapse:
        condition: service_healthy
    ports:
      - '127.0.0.1:18088:80'
      - '127.0.0.1:18443:443'
    volumes:
      - ${AGENT_ROOM_ROOT:?缺少 AGENT_ROOM_ROOT}/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ['CMD', 'caddy', 'validate', '--config', '/etc/caddy/Caddyfile']
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped

volumes:
  caddy-config:
  caddy-data:
  clamav-data:
  object-data:
  postgres-data:
