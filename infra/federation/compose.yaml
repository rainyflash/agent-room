name: agent-room-federation-test

services:
  postgres-alpha:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      POSTGRES_PASSWORD: ${ALPHA_DATABASE_PASSWORD:?缺少 ALPHA_DATABASE_PASSWORD}
      POSTGRES_USER: synapse
    volumes:
      - alpha-database:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synapse -d synapse']
      interval: 2s
      timeout: 3s
      retries: 45

  postgres-beta:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      POSTGRES_PASSWORD: ${BETA_DATABASE_PASSWORD:?缺少 BETA_DATABASE_PASSWORD}
      POSTGRES_USER: synapse
    volumes:
      - beta-database:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synapse -d synapse']
      interval: 2s
      timeout: 3s
      retries: 45

  synapse-alpha:
    image: matrixdotorg/synapse:v1.159.0
    user: '${FEDERATION_HOST_UID:?缺少 FEDERATION_HOST_UID}:${FEDERATION_HOST_GID:?缺少 FEDERATION_HOST_GID}'
    depends_on:
      postgres-alpha:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    ports:
      - '127.0.0.1:18108:8008'
    volumes:
      - ${FEDERATION_RUNTIME_DIR:?缺少 FEDERATION_RUNTIME_DIR}/alpha:/data
      - ${FEDERATION_RUNTIME_DIR:?缺少 FEDERATION_RUNTIME_DIR}/certificates:/certificates:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8008/_matrix/client/versions'', timeout=2)"',
        ]
      interval: 3s
      timeout: 3s
      retries: 60

  synapse-beta:
    image: matrixdotorg/synapse:v1.159.0
    user: '${FEDERATION_HOST_UID:?缺少 FEDERATION_HOST_UID}:${FEDERATION_HOST_GID:?缺少 FEDERATION_HOST_GID}'
    depends_on:
      postgres-beta:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    ports:
      - '127.0.0.1:18208:8008'
    volumes:
      - ${FEDERATION_RUNTIME_DIR:?缺少 FEDERATION_RUNTIME_DIR}/beta:/data
      - ${FEDERATION_RUNTIME_DIR:?缺少 FEDERATION_RUNTIME_DIR}/certificates:/certificates:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8008/_matrix/client/versions'', timeout=2)"',
        ]
      interval: 3s
      timeout: 3s
      retries: 60

  federation-gateway:
    image: caddy:2.11.4-alpine
    user: '${FEDERATION_HOST_UID:?缺少 FEDERATION_HOST_UID}:${FEDERATION_HOST_GID:?缺少 FEDERATION_HOST_GID}'
    depends_on:
      synapse-alpha:
        condition: service_healthy
      synapse-beta:
        condition: service_healthy
    ports:
      - '127.0.0.1:18448:8448'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${FEDERATION_RUNTIME_DIR:?缺少 FEDERATION_RUNTIME_DIR}/certificates:/certificates:ro
    networks:
      default:
        aliases:
          - alpha.agent-room.test
          - beta.agent-room.test
    healthcheck:
      test: ['CMD', 'caddy', 'validate', '--config', '/etc/caddy/Caddyfile']
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  alpha-database:
  beta-database:
