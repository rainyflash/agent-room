# Agent Room 登录主题：与桌面和 Web 应用一致的「游戏大厅」外观。
# 常用页面由本目录的模板渲染；其余页面沿用 Keycloak base 模板，靠下面的类名映射套上同一套样式。
parent=base
import=common/keycloak
styles=css/agent-room.css
locales=zh-Hans,en
meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=ar-html
kcBodyClass=ar-body
kcFormClass=ar-form
kcFormGroupClass=ar-field
kcFormSettingClass=ar-form-row
kcLabelWrapperClass=
kcInputWrapperClass=
kcLabelClass=ar-label
kcInputClass=ar-input
kcSelectClass=ar-input
kcTextareaClass=ar-input
kcCheckboxInputClass=ar-checkbox
kcInputErrorMessageClass=ar-field-error
kcInputHelperTextBeforeClass=ar-hint
kcInputHelperTextAfterClass=ar-hint
kcInputGroup=ar-password
kcFormPasswordVisibilityButtonClass=ar-password-toggle
kcFormPasswordVisibilityIconShow=ar-icon ar-icon--eye
kcFormPasswordVisibilityIconHide=ar-icon ar-icon--eye-off
kcFormOptionsClass=ar-form-options
kcFormOptionsWrapperClass=ar-form-options
kcFormButtonsClass=ar-form-buttons
kcFormButtonsWrapperClass=ar-form-buttons
kcButtonClass=ar-button
kcButtonPrimaryClass=ar-button--primary
kcButtonDefaultClass=ar-button--secondary
kcButtonBlockClass=ar-button--block
kcButtonLargeClass=
kcAlertClass=ar-alert
kcAlertTitleClass=ar-alert__text
kcSignUpClass=ar-signup
kcInfoAreaWrapperClass=ar-signup__inner
kcFormSocialAccountSectionClass=ar-social
kcFormSocialAccountListClass=ar-social__list
kcFormSocialAccountListButtonClass=ar-button ar-button--secondary ar-button--block
