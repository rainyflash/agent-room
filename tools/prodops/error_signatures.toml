# 生产错误汇总的噪音表（`tools/prodops/error_digest.py`，设计在 specs/error-triage/design.md）。
#
# 这里写的是“看着像错、其实正常”的几种，汇总时不报。每条都要写清楚为什么正常；拿不准的别加，
# 让它报出来、看过再说。`summary` 是正则，对着汇总里那一行（已经打码、换过占位）搜。
# 2026-10-24 按生产上 48 小时的日志定的第一版。

# 控制面

[[ignore]]
service = "control-plane"
summary = '^WARN \S+ 网络 Agent 请求失败 failure=(Unauthorized|RateLimited) @ '
reason = "没带或带错网络 Agent 令牌（MCP 目录和扫描器来探 /mcp）、被限速，回答里已经说清楚了"

[[ignore]]
service = "control-plane"
summary = '^WARN \S+ 网络 Agent 请求失败 failure=RoomNotFound @ '
reason = "网络 Agent 给的公开大厅名字对不上，或者敲门敲的房间不存在、不是私人房间、已归档。回答里列出能进的公开大厅、说清私人房间号在地址的哪一段（整个地址也认）；2026-10-26 生产上那次，43 秒后它就凭口令进了私人房间"

[[ignore]]
service = "control-plane"
summary = '^WARN \S+ Agent 口令请求失败 failure=NotFound operation=private_room\.join_code\.reveal @ GET /(devices/current/private-rooms/\{id\}/code|private-rooms/\{id\}/agent-access/code)$'
reason = "房间还没有口令时先查一次：Agent 回 404 以后再去生成；网页打开接入对话框、房间设置的“Agent 进门”也先查，没有就给“生成口令”的按钮（2026-10-27 生产上那次是发版验收头一回建验收房间）"

[[ignore]]
service = "control-plane"
summary = '^WARN \S+ 认证请求失败 failure=ReauthenticationRequired operation=authentication\.authenticate @ '
reason = "要最近登录过的操作（删账户、删 Agent、撤销电脑）在 5 分钟窗口刚过时点了确认：网页从读到会话那一刻起按自己的钟算，只会比服务器晚几秒，晚的那一段由服务器拒了以后的通知补上，确认框马上改成“重新登录”（#627，session-machine.ts 的 RECENT_AUTHENTICATION_WINDOW_MS）。2026-10-28 生产上那次是撤销验收电脑时卡在边上；以前网页不知道、让人白填的那种是 agent-room-ops#34，已经修了"

[[ignore]]
service = "control-plane"
summary = '^WARN \S+ 公开大厅云端入场失败 failure=NotFound @ POST /lobbies/\{id\}/entry$'
reason = "打开的 /lobby/<房间号> 不是公开大厅，也不是你在里面的私人房间：多半是私人房间的地址发给了还不在里面的人，或者房间已经关了。网页说“你进不了这个房间”，摊开账户 ID 请人发给房主（2026-10-27 生产上那次：刚注册的人打开了 Agent 建的私人房间的地址，40 分钟后被邀请进去了）"

[[ignore]]
service = "control-plane"
summary = '^WARN \S+ Agent 大厅入口失败 failure=NotFound @ GET /agents/\{id\}/rooms$'
reason = "“我的 Agent”给每张卡片各问一次它在哪些房间，刷新时一起重问。问的 Agent 已经被删除（别的标签页、别的设备上删的，或刚删完页面上的列表还没换）时，服务器只认还在用的 Agent，回 404；网页把没问成的当作没有、卡片不写房间数，列表一刷新那张卡片就没了（2026-10-30 生产上那次，十几分钟里 11 次、三个关联号）。只放行这个读的接口：带进房间、离开那几个接口的 NotFound 照旧报出来"

[[ignore]]
service = "control-plane"
summary = '^WARN \S+ 等消息时没看成有没有人敲它建的房间的门，过一会儿再看 failure=Unauthorized @ '
reason = "网络 Agent 等消息的途中令牌失效（被停用、删除或换了令牌），这一次查敲门用的还是旧令牌；这次请求本身已经通过了认证，下一次带旧令牌的请求会照常被拒，不是控制面的毛病（2026-10-29 生产上出现过一次）。别的失败类型照旧报出来"

# 身份服务

[[ignore]]
service = "identity"
summary = '^(UPDATE_PASSWORD_ERROR|UPDATE_CREDENTIAL_ERROR) error=password_confirm_error$'
reason = "设密码时两次输入不一样，页面上直接提示了"

[[ignore]]
service = "identity"
summary = '^LOGIN_ERROR error=invalid_user_credentials$'
reason = "输错密码"

[[ignore]]
service = "identity"
summary = '^LOGIN_ERROR error=user_not_found$'
reason = "登录时填的邮箱没有对应的账户（打错了、换了个邮箱），页面上和输错密码一样提示；2026-10-26 生产上那次，近两天注册的账户都已验证，没有卡住的新账户"

[[ignore]]
service = "identity"
summary = "^LOGIN_ERROR error=invalid_request clientId=null reason=Parameter 'client_id' not present or present multiple times in the HTTP request parameters"
reason = "有人打开了没带任何参数的身份服务登录地址（扫描器、手敲的网址、被截掉参数的书签）。我们的网页和桌面端发起登录时一定带 client_id，所以这不是正常登录被挡；2026-10-30 生产上那次只有一条。别和 Invalid scopes 那种混：那个 clientId 是 agent-room-web，不在这条规则里，仍会报出来"

[[ignore]]
service = "identity"
summary = '^RESET_PASSWORD_ERROR error=user_not_found$'
reason = "忘记密码时填的邮箱没有对应的账户（打错了、没注册过）。页面照样说邮件已发出，不透露有没有这个账户"

[[ignore]]
service = "identity"
summary = '^LOGIN_ERROR error=expired_code$'
reason = "登录页开着超过身份服务的登录时限（30 分钟）才提交，Keycloak 说登录超时、在原地从头再来；2026-10-26 生产上那次，同一个浏览器 22 秒后就登录上了"

[[ignore]]
service = "identity"
summary = '^RESTART_AUTHENTICATION_ERROR error=expired_code$'
reason = "登录页开着超过身份服务的登录时限才点“重新开始登录”之类的链接，Keycloak 说登录超时、让人从头再来；和上面 LOGIN_ERROR 的 expired_code 是同一件事，只是点的是重新开始（2026-10-30 生产上那次只有一条）"

[[ignore]]
service = "identity"
summary = '^VERIFY_EMAIL_ERROR error=email_already_verified$'
reason = "验证链接被点了不止一次（邮箱的链接安全扫描也会去点），邮箱已经验证过了"

[[ignore]]
service = "identity"
summary = '^CUSTOM_REQUIRED_ACTION_ERROR error=cookie_not_found$'
reason = "邮箱的链接安全扫描一两秒里从二十多个地址去点验证链接、不带 Cookie，验证后面那一步就报这个（2026-10-22 生产上看到的）"

[[ignore]]
service = "identity"
summary = '^EXECUTE_ACTION_TOKEN_ERROR error=expired_code$'
reason = "点了过期的邮件链接（验证链接 1 小时有效）。#574 起错误页说清楚设过密码就登录、没设就点“忘记密码？”，并给回到 Agent Room 的按钮"

[[ignore]]
service = "identity"
summary = '^CUSTOM_REQUIRED_ACTION_ERROR error=expired_code$'
reason = "点了过期的验证邮件链接（1 小时有效），走到验证那一步才发现过期，和 EXECUTE_ACTION_TOKEN_ERROR 的过期是同一件事；#574 起错误页说清楚怎么办"

[[ignore]]
service = "identity"
summary = '^RESTART_AUTHENTICATION_ERROR error=(already_logged_in|invalid_code)$'
reason = "已经登录过了，浏览器里留着的旧登录页又提交了一次；Keycloak 把人送回网页，#573 起网页替没登录的人重开一次登录。旧页面上的登录步骤号对不上时先记一条 invalid_code，紧接着就是这条 already_logged_in（2026-10-27 生产上两条只差 9 毫秒，之后回调说网页登录还有效、送回了房间）"

[[ignore]]
service = "identity"
summary = '^LOGIN_ERROR error=(already_logged_in|invalid_code)$'
reason = "已经登录的浏览器又提交了一次登录页（点了两次登录、别的标签页留着旧登录页）：先记 invalid_code，紧接着 already_logged_in，Keycloak 带着 authentication_expired 回到回调，#588 起网页登录还有效就送回房间（2026-10-28 生产上两次，每次两条只差 30 毫秒以内，控制面随即回 303 送回房间）。和上面 RESTART_AUTHENTICATION_ERROR 那条是同一件事，只是事件类型不同"

[[ignore]]
service = "identity"
summary = '^REGISTER_ERROR error=(already_logged_in|invalid_code)$'
reason = "别的标签页已经登录完了，这个标签页留着的注册页又被提交：先记 invalid_code，紧接着 already_logged_in，Keycloak 把人送回网页，#588 起网页登录还有效就送回房间（2026-10-28 生产上那次，同一个浏览器两秒里留着的验证邮箱页、注册页、登录页各来了一对，每对只差 6 毫秒，控制面都说网页登录还有效、送回了房间）。和上面 LOGIN_ERROR 那条是同一件事，只是事件类型不同"

[[ignore]]
service = "identity"
summary = '^CUSTOM_REQUIRED_ACTION_ERROR error=(already_logged_in|invalid_code)$'
reason = "别的标签页已经登录完了（比如在新标签页里点了验证邮件），这个标签页留着的验证邮箱这类页面自己刷新或又被提交：登录页模板里的 startSessionPolling 盯着别的标签页。Keycloak 把人送回网页，#588 起网页登录还有效就直接回房间（2026-10-25 生产上看到的，9 秒前同一个浏览器刚有一条 RESTART_AUTHENTICATION_ERROR）"

[[ignore]]
service = "identity"
summary = '^REGISTER_ERROR error=invalid_registration$'
reason = "注册表单没填对（密码不合要求、两次不一样、少填了），页面上直接提示了；2026-10-25 生产上那次，同一个浏览器两分钟后就登录上了"

[[ignore]]
service = "identity"
summary = '^REGISTER_ERROR error=email_in_use$'
reason = "拿已经注册过的邮箱又注册一次，注册页上直接说这个邮箱已经有账户；2026-10-27 生产上那次是验证链接过期了、以为要重新注册，两分钟后就登录上了"

[[ignore]]
service = "identity"
summary = '^REGISTER_ERROR error=expired_code$'
reason = "账户已经建好了，留着的旧注册页又被提交，Keycloak 给“页面已过期”；2026-10-25 生产上那次是验证完邮箱又点了旧标签页里的注册"

[[ignore]]
service = "identity"
summary = '^OAUTH2_DEVICE_VERIFY_USER_CODE_ERROR error=invalid_oauth2_user_code$'
reason = "打开了已经过期或用过的设备码批准链接，页面上让重新输入；2026-10-25 是发版验收重发设备码以后又打开了第一个"

[[ignore]]
service = "identity"
summary = '^WARN org\.keycloak\.common\.Profile Deprecated features '
reason = "Keycloak 启动时提示有默认开着的旧功能，每次重建身份服务都有"

[[ignore]]
service = "identity"
summary = '^WARN org\.hibernate\.orm\.session HHH90010101: Closing shared session with unprocessed transaction completion actions$'
reason = "几个请求同时动同一个登录会话、有一个回滚时，Hibernate 关会话时多记的一句，功能不受影响（keycloak/keycloak#52583，26.8.0 起不再记；升到 26.8 以后删掉这条）。2026-10-27 生产上那次是一个人开着好几个登录标签页同时登录完"

# Synapse

[[ignore]]
service = "synapse"
summary = '^GET /_matrix/client/v3/user/\{id\}/account_data/\S+ → 404$'
reason = "账户数据还没写过时读回 404，客户端第一次读都是这样"

[[ignore]]
service = "synapse"
summary = '^PUT /_matrix/client/v3/presence/\{id\}/status → 429$'
reason = "在线状态每个用户 10 秒只认一次，网络 Agent 心跳和同步撞上就是 429（见 CLAUDE.md）"

[[ignore]]
service = "synapse"
summary = '^GET /_matrix/client/v3/rooms/\{id\}/state/\S+ → 404$'
reason = "问一条还没写过的状态（Agent 的名片、某人的成员事件）回 404，写名片前本来就要先问"

[[ignore]]
service = "synapse"
summary = '^GET /_matrix/client/v3/rooms/\{id\}/state/m\.room\.member/\{id\} → 403$'
reason = "读成员状态回 403 只说明问的人没进过这个房间。Agent 往自己没进的房间发消息、读消息，Bridge 先问自己在不在，就是这样，答 Agent bridge.room_not_joined（agent-room-ops#52）；控制面替别人查时出错，控制面自己的日志另报 content.authorization.unavailable"

[[ignore]]
service = "synapse"
summary = '^GET /_matrix/client/v3/room_keys/(version|keys/\S*) → 404$'
reason = "还没有密钥备份，或者备份里还没有这把密钥（#441）"

[[ignore]]
service = "synapse"
summary = '^GET /_matrix/client/unstable/\S+/rtc/transports → 404$'
reason = "matrix-js-sdk 探 MatrixRTC，我们没开"

[[ignore]]
service = "synapse"
summary = '^WARNING synapse\.storage\.database Starting db (txn .* from sentinel context|connection from sentinel context)'
reason = "Synapse 后台任务的指标提示，不影响功能"

[[ignore]]
service = "synapse"
summary = '^WARNING synapse\.storage\.txn \[TXN OPERROR\] \{\S*\} could not serialize access due to concurrent update$'
reason = "PostgreSQL 的可重复读事务撞上并发更新，Synapse 会自动重试这个事务，日志里只是一条提示"

[[ignore]]
service = "synapse"
summary = '^WARNING synapse\.http\.server Not sending response to request '
reason = "客户端在回答之前断开了（长轮询被取消、页面关了）"

[[ignore]]
service = "synapse"
summary = '^WARNING synapse\.http\.site Aborting connection from .* because `content-type: multipart/form-data` is unsupported: '
reason = "有人往聊天服务器发 multipart 表单，Synapse 读完请求头就断开、不处理。Matrix 客户端从来不这样发（传文件是原样的正文），是扫描器在试上传接口（2026-10-28 生产上一秒里往根路径 POST / 连发 4 次，前后没有登录了的请求）"

[[ignore]]
service = "synapse"
summary = '^WARNING synapse\.handlers\.pagination \[purge\] purging events not possible: No event found'
reason = "按保留期清理时这一段没有要删的事件"

[[ignore]]
service = "synapse"
summary = '^WARNING synapse\.api\.auth\.internal Invalid access token in auth: '
reason = "带着认不出格式的令牌来请求（扫描器、过时的客户端），已经回了 401"

# 网关

[[ignore]]
service = "gateway"
summary = '^warn (admin admin endpoint disabled|http HTTP/N skipped because it requires TLS)$'
reason = "Caddy 启动时的提示：管理端口关着，TLS 在前面一层"

[[ignore]]
service = "gateway"
summary = '^warn http\.handlers\.reverse_proxy aborting with incomplete response$'
reason = "客户端在流式回答（长轮询、下载）中途断开"

[[ignore]]
service = "gateway"
summary = '^warn http looking up info for HTTP challenge$'
reason = "有人拿不是我们申请的令牌来访问 /.well-known/acme-challenge/（别处替指到这台服务器的域名验证证书，或者扫描器），Caddy 认不出就回 404。我们自己申请证书时令牌就在 Caddy 的内存里，不会走到这一行；自己的证书没申请成报的是别的行。2026-10-27 www 改 DNS 那半小时有 87 次，当晚没改什么又来了 1 次（agent-room-ops#26）"

[[ignore]]
service = "identity"
summary = "^WARN org\\.keycloak\\.protocol\\.oidc\\.endpoints\\.request\\.AuthorizationEndpointRequestParserProcessor Parameter '[^']*' not present or present multiple times in the HTTP request parameters$"
reason = "有人打开了登录地址却没带 client_id 之类的必填参数（扫描器、手敲或截断的链接），Keycloak 直接回错误页，没有登录被挡住；我们自己发起的登录总是带齐参数（2026-10-30 生产上只出现一次，缺的是 client_id，agent-room-ops#50）"
