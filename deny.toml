[graph]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "生产路径只使用公开 JWKS 执行 RSA 验签；隔离回环 OIDC 协议测试会即时生成临时 RSA 密钥并仅在测试进程内签名，上游当前没有修复版本，发布新版本后必须移除此例外" },
  { id = "RUSTSEC-2026-0173", reason = "Matrix SDK 0.18.0 仅在编译期文档宏链路传递依赖已停止维护的 proc-macro-error2；该公告不含已知漏洞，Matrix SDK 主线已移除该依赖，下一稳定版发布后必须升级并删除此例外" },
  { id = "RUSTSEC-2026-0247", reason = "Matrix SDK 0.18.0 经 eyeball-im/imbl 传递依赖已停止维护的 bitmaps；该公告不含已知漏洞且没有修复版本，必须持续跟踪上游替换进展并在可用稳定版发布后删除此例外" },
]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # xxhash-rust 使用的 OSI 批准 Boost Software License；不要与 Business Source License 混淆。
  "BSL-1.0",
  "CC0-1.0",
  # webpki-root-certs 中 Mozilla CA 数据使用的宽松数据许可证；发布时必须随三方通知保留原文。
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
