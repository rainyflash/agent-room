[graph]
all-features = true

[advisories]
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "生产路径只使用公开 JWKS 执行 RSA 验签；隔离回环 OIDC 协议测试会即时生成临时 RSA 密钥并仅在测试进程内签名，上游当前没有修复版本，发布新版本后必须移除此例外" },
  { id = "RUSTSEC-2026-0292", reason = "imbl-sized-chunks 0.1.3 只经 Matrix SDK 0.18 的 eyeball-im/imbl 传递引入，仅当集合元素析构时 panic 才会重复释放；本项目只用经典 sync_once，不启用事件缓存、时间线或滑动同步，运行路径上 SDK 只把房间句柄放进该集合，其析构不会主动 panic，同步数据也无法改变析构行为；修复需 Matrix SDK 0.19，但它要求的 libsqlite3-sys 0.38 超出 Bridge 本地存储所用 sqlx 0.9.0 的上限，sqlx 放宽后必须升级 Matrix SDK 并删除此例外（跟踪 #101）" },
  { id = "RUSTSEC-2026-0318", reason = "matrix-sdk-crypto 0.18 只在用 IdentityBasedStrategy 加密自定义设备间消息（OlmMachine::encrypt_content_for_devices、Device::encrypt_event_raw）且收件人没有交叉签名身份时 panic；本项目的交接、房间密钥重发和请求都经 encrypt_and_send_raw_to_device 用 CollectStrategy::AllDevices，IdentityBasedStrategy 只用于分发房间密钥，那条路径不调用出问题的函数；修复需 Matrix SDK 0.19，同样卡在 sqlx 0.9.0 的 libsqlite3-sys 上限，随 #101 升级后删除此例外（跟踪 #279）" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 只经 jsonwebtoken 11 与 openidconnect 4 依赖的 p256 0.13/ecdsa 0.16/elliptic-curve 0.13 传递引入，生产路径只用它拿公钥验签（身份服务 ID Token、本机 MCP 的 OAuth 令牌、A2A 名片签名），参与运算的都是公开数据，计时差异不泄露秘密；我们自己签的 JWT 用 HMAC，不走椭圆曲线；修复在 0.7.6，要等上游换到新一代 p256 才能升级，届时删除此例外（跟踪 #577）" },
  { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.35.0 带进来的 SQLite 3.53 在数据库文件和旁边的 -wal 页大小不一致时可能读回没初始化的页缓存，要让进程打开别人做过手脚的一对文件；我们打开的 SQLite 文件（Bridge 本地存储、Matrix 状态和加密存储、控制面替网络 Agent 管的加密存储）都由自己的进程写在当前用户或控制面自己的目录里，能在那里放文件的人本来就能改存储、拿同一用户的凭据，读回的只是本进程的旧内存；修复在 libsqlite3-sys 0.39（rusqlite 0.41），可 sqlx-sqlite 0.9.0 只认 <0.38，matrix-sdk 0.19.1 用的 rusqlite 0.40 还是 0.38，SQLite 只能链接一份，等两边上游都放开后一起升级并删除此例外（跟踪 #783，同 #101）" },
]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  # interprocess 及其小型平台辅助依赖使用的 OSI 批准零条款 BSD 许可证。
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # xxhash-rust 使用的 OSI 批准 Boost Software License；不要与 Business Source License 混淆。
  "BSL-1.0",
  "CC0-1.0",
  # webpki-root-certs 中 Mozilla CA 数据使用的宽松数据许可证；发布时必须随三方通知保留原文。
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
