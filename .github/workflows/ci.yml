name: 持续集成

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 检查范围
        type: choice
        required: true
        default: all
        options: [all, session, automation]
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # 同一分支只验证最新修订，避免快速连续提交并行消耗 Actions 分钟数。
  group: ci-${{ github.ref }}-${{ inputs.suite || 'all' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  PYTHONUTF8: '1'
  RUST_BACKTRACE: '1'

jobs:
  automation:
    name: 自动回复真实数据库与扫描验收
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'automation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 版本 7.0.1
      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 版本 7.0.0
        with:
          node-version-file: .node-version
      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: 恢复编译缓存
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # 版本 2.9.2
        with:
          shared-key: linux-quality
          add-job-id-key: false
          save-if: false
      - name: 检查自动回复与界面
        run: |
          cargo fmt --all --check
          cargo clippy -p agent-room-application -p agent-room-content-adapter -p agent-room-postgres-adapter -p agent-room-control-plane -p agent-room-bridge --all-targets -- -D warnings
          cargo test -p agent-room-application --test automation_flow
          cargo test -p agent-room-bridge-core --test message_publication_flow
          cargo test -p agent-room-content-adapter -p agent-room-control-plane -p agent-room-bridge --lib
          corepack pnpm@10.28.0 install --frozen-lockfile
          corepack pnpm@10.28.0 --filter @agent-room/protocol build
          corepack pnpm@10.28.0 --filter @agent-room/web typecheck
          corepack pnpm@10.28.0 --filter @agent-room/web exec vitest run src/features/automation
      - name: 准备隔离 PostgreSQL 与 ClamAV
        shell: pwsh
        run: |
          ./tools/dev-infra.ps1 prepare
          docker compose --project-name agent-room-dev --env-file .env.local --file infra/compose/compose.yaml up --detach --wait --wait-timeout 420 postgres content-scanner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证实际数据库与扫描服务
        env:
          AGENT_ROOM_TEST_SCANNER_ADDRESS: 127.0.0.1:13310
        run: |
          python -c "from tools.database import read_environment, ENV_FILE, run_in_test_database; run_in_test_database(read_environment(ENV_FILE), [['cargo','test','-p','agent-room-postgres-adapter','--test','automation','--','--ignored']])"
          cargo test -p agent-room-content-adapter --test automation_live -- --ignored
      - name: 停止隔离依赖
        if: ${{ always() && hashFiles('.env.local') != '' }}
        run: docker compose --project-name agent-room-dev --env-file .env.local --file infra/compose/compose.yaml down --volumes

  automation-images:
    name: 自动回复兼容服务候选镜像
    needs: automation
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'automation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane
            file: infra/production/Containerfile.control-plane
          - name: web
            file: infra/production/Containerfile.web
    steps:
      - name: 检出已验证提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 版本 7.0.1
      - name: 登录 GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # 版本 4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 安装 Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # 版本 4.3.0
      - name: 构建兼容服务候选
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # 版本 7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:automation-${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.name }}-amd64
          build-args: |
            VITE_AGENT_ROOM_CONTROL_PLANE_URL=https://app.room.the-zeroth.com/_agent-room/api
            VITE_AGENT_ROOM_IDENTITY_REGISTRATION_MODE=${{ vars.AGENT_ROOM_IDENTITY_REGISTRATION_MODE }}
            VITE_AGENT_ROOM_MATRIX_HOMESERVER_URL=https://matrix.room.the-zeroth.com
            VITE_AGENT_ROOM_WINDOWS_DOWNLOAD_URL=https://github.com/rainyflash/agent-room/releases/download/v0.1.0-alpha.26/agent-room-installer-v0.1.0-alpha.26-windows-x86_64.exe
      - name: 保存不可变镜像摘要
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          mkdir -p image-digest
          printf '%s\n' "$IMAGE_DIGEST" > "image-digest/$IMAGE_NAME.digest"
      - name: 上传候选镜像证据
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 版本 7.0.1
        with:
          name: automation-image-${{ matrix.name }}
          path: image-digest/
          if-no-files-found: error
          retention-days: 7

  quality:
    name: 格式、类型与测试
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 版本 7.0.1
      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 版本 7.0.0
        with:
          node-version-file: .node-version
      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: 恢复 Linux 质量门编译缓存
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # 版本 2.9.2
        with:
          shared-key: linux-quality
          add-job-id-key: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: 安装 Linux 桌面编译依赖
        run: bash tools/install-linux-desktop-deps.sh
      - name: 安装 Node 依赖
        run: corepack pnpm@10.28.0 install --frozen-lockfile
      - name: 检查 Rust 格式
        run: cargo fmt --all --check
      - name: 检查 Rust 静态规则
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: 运行 Rust 测试
        run: cargo test --workspace --all-features
      - name: 检查 TypeScript 与格式
        run: corepack pnpm@10.28.0 format:check && corepack pnpm@10.28.0 lint && corepack pnpm@10.28.0 typecheck
      - name: 构建 TypeScript 生产产物
        run: corepack pnpm@10.28.0 build
      - name: 运行 TypeScript 测试
        run: corepack pnpm@10.28.0 test
      - name: 运行 Python 工具测试
        run: python -m unittest discover -s tools/tests -p 'test_*.py'
      - name: 检查凭据泄漏
        run: node tools/check-secrets.mjs --self-test && corepack pnpm@10.28.0 secrets:check
      - name: 验证 TypeScript 覆盖率
        run: corepack pnpm@10.28.0 test:coverage
      - name: 检查协议生成物
        run: corepack pnpm@10.28.0 protocol:check
      - name: 检查 Action 固定策略
        run: corepack pnpm@10.28.0 actions:check

  windows-runtime:
    name: Windows 客户端运行时原生检查
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'all' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 版本 7.0.1
      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 版本 7.0.0
        with:
          node-version-file: .node-version
      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: 恢复 Windows Runtime 编译缓存
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # 版本 2.9.2
        with:
          shared-key: windows-runtime
          add-job-id-key: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: 安装 Node 依赖
        run: corepack pnpm@10.28.0 install --frozen-lockfile
      - name: 检查 Bridge、MCP 与平台安全存储适配器
        run: cargo check -p agent-room-bridge -p agent-room-mcp -p agent-room-cli --all-targets
      - name: 构建桌面专用 Web 产物
        run: corepack pnpm@10.28.0 --filter @agent-room/web build:desktop
      - name: 检查桌面壳与窄化 Capabilities
        run: cargo check -p agent-room-desktop --all-targets --all-features
      - name: 运行桌面壳领域测试
        run: cargo test -p agent-room-desktop --all-features

  web-browser:
    name: Web 真实浏览器验收
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 版本 7.0.1
      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 版本 7.0.0
        with:
          node-version-file: .node-version
      - name: 安装 Node 依赖
        run: corepack pnpm@10.28.0 install --frozen-lockfile
      - name: 安装 Chromium 与系统依赖
        run: corepack pnpm@10.28.0 --filter @agent-room/web exec playwright install --with-deps chromium
      - name: 验收桌面、移动、离线与深链边界
        run: corepack pnpm@10.28.0 --filter @agent-room/web test:browser
      - name: 验收已发布 Alpha 的版本化下载入口
        env:
          VITE_AGENT_ROOM_IDENTITY_REGISTRATION_MODE: open-email
          VITE_AGENT_ROOM_WINDOWS_DOWNLOAD_URL: https://github.com/rainyflash/agent-room/releases/download/v0.1.0-alpha.26/agent-room-installer-v0.1.0-alpha.26-windows-x86_64.exe
        run: corepack pnpm@10.28.0 --filter @agent-room/web exec playwright test e2e/public-alpha-landing.e2e.ts
      - name: 上传浏览器验收产物
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 版本 7.0.1
        with:
          name: task-19-browser-evidence
          path: |
            artifacts/browser/task-19/
            artifacts/browser/public-alpha/
            artifacts/playwright/task-19-results/
          if-no-files-found: warn
          retention-days: 7

  supply-chain:
    name: 供应链与物料清单
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 版本 7.0.1
        with:
          fetch-depth: 0
      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 版本 7.0.0
        with:
          node-version-file: .node-version
      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: 安装依赖
        run: corepack pnpm@10.28.0 install --frozen-lockfile
      - name: 审计 Node 依赖
        run: corepack pnpm@10.28.0 audit:node
      - name: 审计 Rust 依赖与许可证
        run: cargo install cargo-deny --locked --version 0.20.2 && cargo deny check
      - name: 验证开源文档与许可证清单
        run: python tools/license_inventory.py check && python tools/open_source.py
      - name: 生成物料清单
        shell: pwsh
        run: ./tools/sbom.ps1
      - name: 上传物料清单
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 版本 7.0.1
        with:
          name: sbom
          path: artifacts/*.json
          if-no-files-found: error

  live-session:
    name: 真实网页登录与会话恢复
    needs: quality
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.suite == 'session' || needs.quality.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 版本 7.0.1
      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 版本 7.0.0
        with:
          node-version-file: .node-version
      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: 恢复 Linux 编译缓存
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # 版本 2.9.2
        with:
          shared-key: linux-quality
          add-job-id-key: false
          save-if: false
      - name: 安装 Linux 编译依赖
        run: bash tools/install-linux-desktop-deps.sh
      - name: 安装工具与 Chromium
        run: |
          node tools/bootstrap.mjs
          corepack pnpm@10.28.0 --filter @agent-room/web exec playwright install --with-deps chromium
      - name: 预编译控制平面
        run: cargo build --locked -p agent-room-control-plane
      - name: 启动并初始化隔离依赖
        shell: pwsh
        run: |
          ./tools/dev-infra.ps1 up
          ./tools/dev-infra.ps1 seed
          python tools/database.py migrate
      - name: 验证 OIDC、Matrix SSO 与浏览器会话恢复
        run: python tools/web.py
      - name: 上传 OIDC 浏览器失败证据
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 版本 7.0.1
        with:
          name: task-19-live-session-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/playwright/task-19-live-results
          if-no-files-found: warn
          retention-days: 7
      - name: 停止外部依赖
        if: always()
        shell: pwsh
        run: ./tools/dev-infra.ps1 down

  integration:
    name: PostgreSQL、Matrix、对象存储与协议集成
    needs: quality
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 版本 7.0.1
      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 版本 7.0.0
        with:
          node-version-file: .node-version
      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: 安装 Linux 桌面编译依赖
        run: bash tools/install-linux-desktop-deps.sh
      - name: 从干净检出引导贡献者环境
        run: node tools/bootstrap.mjs
      - name: 启动真实外部依赖
        shell: pwsh
        run: ./tools/dev-infra.ps1 up
      - name: 创建 Matrix 测试主体和种子数据
        shell: pwsh
        run: ./tools/dev-infra.ps1 seed
      - name: 验证数据库与 Matrix 并合并 Rust 覆盖率
        run: |
          rustup component add llvm-tools-preview --toolchain 1.97.1
          cargo install cargo-llvm-cov --locked --version 0.9.0
          python tools/database.py coverage
      - name: 确认覆盖率未改写源码并清理平台生成 Schema
        run: python tools/build_hygiene.py
      - name: 验证发布形态 PostgreSQL 容量预算
        run: python tools/capacity_database.py
      - name: 上传 PostgreSQL 容量证据
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 版本 7.0.1
        with:
          name: task-39-database-capacity-evidence
          path: artifacts/capacity/database-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: 应用控制平面数据库迁移
        run: python tools/database.py migrate
      - name: 生成默认自托管配置并验证生产 Compose
        run: |
          python tools/self_host.py init --domain room.example.com --email operator@example.com --output "${RUNNER_TEMP}/agent-room-deployment.json"
          python tools/production.py validate --config "${RUNNER_TEMP}/agent-room-deployment.json" --state-dir "${RUNNER_TEMP}/agent-room-state"
      - name: 再次执行种子验证幂等性
        shell: pwsh
        run: ./tools/dev-infra.ps1 seed
      - name: 验证控制平面就绪状态与逐层断连映射
        run: python tools/control-plane.py test
      - name: 停止外部依赖
        if: always()
        shell: pwsh
        run: ./tools/dev-infra.ps1 down

  agent-runtime-image:
    name: Linux Agent 运行时镜像与 HTTPS MCP 验收
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 版本 7.0.1
      - name: 构建非 root Agent 运行时镜像
        run: docker build --file infra/agent-runtime/Containerfile --tag agent-room-runtime:acceptance .
      - name: 验证 TLS、MCP 鉴权与发行 CLI
        run: sudo python3 tools/agent_runtime_acceptance.py --image agent-room-runtime:acceptance --report artifacts/agent-runtime-acceptance.json
      - name: 上传 Agent 运行时验收证据
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 版本 7.0.1
        with:
          name: agent-runtime-acceptance
          path: artifacts/agent-runtime-acceptance.json
          if-no-files-found: warn
          retention-days: 7

  agent-runtime-live:
    name: Linux 无桌面凭据恢复与 Matrix 真实收发
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 版本 7.0.1
      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 版本 7.0.0
        with:
          node-version-file: .node-version
      - name: 安装 Rust 工具链
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: 恢复 Linux 编译缓存
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # 版本 2.9.2
        with:
          shared-key: linux-quality
          add-job-id-key: false
          save-if: false
      - name: 安装 Linux 编译依赖
        run: bash tools/install-linux-desktop-deps.sh
      - name: 安装工具与 Chromium
        run: |
          node tools/bootstrap.mjs
          corepack pnpm@10.28.0 --filter @agent-room/web exec playwright install --with-deps chromium
      - name: 验收 Vault 重启、独立身份及 Matrix 收发
        run: python tools/headless_acceptance.py
      - name: 上传服务器验收证据
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 版本 7.0.1
        with:
          name: agent-runtime-live
          path: artifacts/agent-runtime-live.json
          if-no-files-found: warn
          retention-days: 7
