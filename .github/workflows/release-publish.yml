name: 验证并发布 testing 签名发行

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已完成 testing 签名和服务端晋级的草稿 Release 标签
        required: true
        type: string
      installed_version:
        description: 当前渠道已安装版本，用于显式升级或回滚验证
        required: true
        type: string
      highest_sequence:
        description: 当前渠道已信任的最高发布序号
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish-${{ inputs.tag }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'

jobs:
  publish:
    name: 最终密码学门禁与发布
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: public-release
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出受保护主分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 版本 7.0.1
        with:
          fetch-depth: 0
      - name: 下载草稿发行全部资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir candidate
          gh release download "$TAG" --dir candidate
      - name: 安装 Rust 与 Cosign
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: 安装 Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # 版本 4.1.2
        with:
          cosign-release: v3.1.3
      - name: 登录 GHCR 以验证候选镜像
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # 版本 4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建发布签名验证器
        run: cargo build --locked --release --package agent-room-release-tool
      - name: 构造 testing 渠道公开信任文档
        env:
          RELEASE_KEY_ID: ${{ vars.AGENT_ROOM_TESTING_RELEASE_KEY_ID }}
          RELEASE_PUBLIC_KEY: ${{ vars.AGENT_ROOM_TESTING_RELEASE_PUBLIC_KEY }}
        run: >-
          jq -n --arg keyId "$RELEASE_KEY_ID" --arg publicKey "$RELEASE_PUBLIC_KEY"
          '{schemaVersion: 1, algorithm: "Ed25519", keyId: $keyId, publicKey: $publicKey}'
          > candidate/release-public-key.json
      - name: 拒绝非 testing 渠道草稿
        run: test "$(jq -r .channel candidate/release-metadata.json)" = testing
      - name: 核对服务端已完成兼容晋级
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          test "$(jq -er '.tag | select(type == "string")' candidate/release-metadata.json)" = "$TAG"
          test "$(jq -er '.version | select(type == "string")' candidate/release-metadata.json)" = "$VERSION"
          REVISION="$(jq -er '.revision | select(type == "string" and test("^[0-9a-f]{40}$"))' candidate/release-metadata.json)"
          test "$(git rev-parse --verify "$REVISION^{commit}")" = "$REVISION"
          python tools/release_promotion.py verify --record candidate/release-promotion-compatible-server.json --expected-stage compatible-server --version "$VERSION" --revision "$REVISION"
          python tools/release_promotion.py verify-evidence --record candidate/release-promotion-compatible-server.json --root candidate --release-base-url "https://github.com/${{ github.repository }}/releases/download/$TAG/"
      - name: 验证 testing 签名、所有摘要、SBOM 与 Sigstore 身份
        env:
          INSTALLED_VERSION: ${{ inputs.installed_version }}
          HIGHEST_SEQUENCE: ${{ inputs.highest_sequence }}
          CERTIFICATE_IDENTITY: ^https://github.com/${{ github.repository }}/\.github/workflows/release-candidate\.yml@refs/heads/main$
        run: >-
          python tools/release.py verify
          --root candidate
          --inventory candidate/release-inventory.json
          --manifest candidate/release.json
          --evidence candidate/release-evidence.json
          --signed-manifest candidate/release.signed.json
          --public-key candidate/release-public-key.json
          --release-tool target/release/agent-room-release-tool
          --installed-version "$INSTALLED_VERSION"
          --highest-sequence "$HIGHEST_SEQUENCE"
          --now-unix-seconds "$(date +%s)"
          --certificate-identity-regexp "$CERTIFICATE_IDENTITY"
      - name: 公开版本并原子推进渠道入口
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          CHANNEL="$(jq -r .channel candidate/release-metadata.json)"
          if [ "$CHANNEL" = stable ]; then
            gh release edit "$TAG" --draft=false --latest
          else
            gh release edit "$TAG" --draft=false --prerelease
          fi
          CHANNEL_TAG="channel-$CHANNEL"
          if gh release view "$CHANNEL_TAG" >/dev/null 2>&1; then
            gh release upload "$CHANNEL_TAG" candidate/release.signed.json --clobber
          else
            gh release create "$CHANNEL_TAG" candidate/release.signed.json --title "Agent Room $CHANNEL channel" --notes "Mutable channel pointer; authenticity and monotonicity are enforced by the signed manifest."
          fi
      - name: 记录客户端发布阶段
        env:
          TAG: ${{ inputs.tag }}
        run: |
          SIGNED_SHA="$(sha256sum candidate/release.signed.json | cut -d ' ' -f 1)"
          NOW="$(date +%s)"
          python tools/release_promotion.py advance --record candidate/release-promotion-compatible-server.json --output candidate/release-promotion-clients-published.json --stage clients-published --evidence-url "https://github.com/${{ github.repository }}/releases/tag/$TAG" --evidence-sha256 "$SIGNED_SHA" --recorded-at-unix-seconds "$NOW"
      - name: 上传客户端晋级证据
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" candidate/release-promotion-clients-published.json
