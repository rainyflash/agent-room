name: 验证并发布 testing 签名发行
run-name: ${{ inputs.operation_id && format('release-flow:{0}', inputs.operation_id) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: 发布调度续跑标识
        required: false
        type: string
      expected_revision:
        description: 发布调度锁定的候选提交
        required: false
        type: string
      tag:
        description: 已完成 testing 签名和服务端晋级的草稿 Release 标签
        required: true
        type: string
      installed_version:
        description: 当前渠道已安装版本，用于显式升级或回滚验证
        required: true
        type: string
      highest_sequence:
        description: 当前渠道已信任的最高发布序号
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish-${{ inputs.tag }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'

jobs:
  publish:
    name: 最终密码学门禁与发布
    # 受保护的 release/* 分支钉住候选提交，发布期间 main 可以照常合并。
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
    environment: public-release
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 核对发布调度提交
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          # release/* 分支只接受锁定模式：运行的核验代码必须就是候选提交。
          if [ "$GITHUB_REF" != refs/heads/main ]; then test -n "$EXPECTED_REVISION"; fi
          if [ -n "$EXPECTED_REVISION" ]; then test "$GITHUB_SHA" = "$EXPECTED_REVISION"; fi
      - name: 检出受保护分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 版本 7.0.1
        with:
          fetch-depth: 0
      - name: 下载草稿发行全部资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir candidate
          gh release download "$TAG" --dir candidate
      - name: 安装 Rust 与 Cosign
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: 安装 Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # 版本 4.1.2
        with:
          cosign-release: v3.1.3
      - name: 登录 GHCR 以验证候选镜像
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # 版本 4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建发布签名验证器
        run: cargo build --locked --release --package agent-room-release-tool
      - name: 构造 testing 渠道公开信任文档
        env:
          RELEASE_KEY_ID: ${{ vars.AGENT_ROOM_TESTING_RELEASE_KEY_ID }}
          RELEASE_PUBLIC_KEY: ${{ vars.AGENT_ROOM_TESTING_RELEASE_PUBLIC_KEY }}
        run: >-
          jq -n --arg keyId "$RELEASE_KEY_ID" --arg publicKey "$RELEASE_PUBLIC_KEY"
          '{schemaVersion: 1, algorithm: "Ed25519", keyId: $keyId, publicKey: $publicKey}'
          > candidate/release-public-key.json
      - name: 拒绝非 testing 渠道草稿
        run: test "$(jq -r .channel candidate/release-metadata.json)" = testing
      - name: 核对服务端已完成兼容晋级
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          VERSION="${TAG#v}"
          test "$(jq -er '.tag | select(type == "string")' candidate/release-metadata.json)" = "$TAG"
          test "$(jq -er '.version | select(type == "string")' candidate/release-metadata.json)" = "$VERSION"
          REVISION="$(jq -er '.revision | select(type == "string" and test("^[0-9a-f]{40}$"))' candidate/release-metadata.json)"
          test "$(git rev-parse --verify "$REVISION^{commit}")" = "$REVISION"
          if [ -n "$EXPECTED_REVISION" ]; then test "$EXPECTED_REVISION" = "$REVISION"; fi
          # 发布分支只钉住提交；候选本身必须已经合入受保护的 main。
          git merge-base --is-ancestor "$REVISION" origin/main
          python tools/release_promotion.py verify --record candidate/release-promotion-compatible-server.json --expected-stage compatible-server --version "$VERSION" --revision "$REVISION"
          python tools/release_promotion.py verify-evidence --record candidate/release-promotion-compatible-server.json --root candidate --release-base-url "https://github.com/${{ github.repository }}/releases/download/$TAG/"
      - name: 验证 testing 签名、所有摘要、SBOM 与 Sigstore 身份
        env:
          INSTALLED_VERSION: ${{ inputs.installed_version }}
          HIGHEST_SEQUENCE: ${{ inputs.highest_sequence }}
          CERTIFICATE_IDENTITY: ^https://github.com/${{ github.repository }}/\.github/workflows/release-candidate\.yml@refs/heads/main$
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          REVISION_ARGS=()
          if [ -n "$EXPECTED_REVISION" ]; then REVISION_ARGS=(--expected-revision "$EXPECTED_REVISION"); fi
          python tools/release.py verify \
            --root candidate \
            --inventory candidate/release-inventory.json \
            --manifest candidate/release.json \
            --evidence candidate/release-evidence.json \
            --signed-manifest candidate/release.signed.json \
            --public-key candidate/release-public-key.json \
            --release-tool target/release/agent-room-release-tool \
            --installed-version "$INSTALLED_VERSION" \
            --highest-sequence "$HIGHEST_SEQUENCE" \
            --now-unix-seconds "$(date +%s)" \
            --certificate-identity-regexp "$CERTIFICATE_IDENTITY" \
            "${REVISION_ARGS[@]}"
      - name: 验证新设备升级及真实宿主接待
        env:
          TAG: ${{ inputs.tag }}
        run: python tools/release_acceptance.py --root candidate --version "${TAG#v}" --revision "$(jq -er .revision candidate/release-metadata.json)"
      - name: 核对原生安装验收及更新载荷签名
        run: python tools/release_native.py --root candidate --release-tool target/release/agent-room-release-tool
      - name: 整理面向普通用户的 Release 下载入口
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          python tools/release_surface.py apply --repository "${{ github.repository }}" --tag "$TAG" --version "$VERSION"
      - name: 公开版本并原子推进渠道入口
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          CHANNEL="$(jq -r .channel candidate/release-metadata.json)"
          VERSION="${TAG#v}"
          python tools/release_surface.py publish --repository "${{ github.repository }}" --tag "$TAG" --version "$VERSION" --channel "$CHANNEL"
          CHANNEL_TAG="channel-$CHANNEL"
          if gh release view "$CHANNEL_TAG" >/dev/null 2>&1; then
            gh release upload "$CHANNEL_TAG" candidate/release.signed.json --clobber
          else
            gh release create "$CHANNEL_TAG" candidate/release.signed.json --title "Agent Room $CHANNEL channel" --notes "Mutable channel pointer; authenticity and monotonicity are enforced by the signed manifest."
          fi
      - name: 记录客户端发布阶段
        env:
          TAG: ${{ inputs.tag }}
        run: |
          SIGNED_SHA="$(sha256sum candidate/release.signed.json | cut -d ' ' -f 1)"
          NOW="$(date +%s)"
          python tools/release_promotion.py advance --record candidate/release-promotion-compatible-server.json --output candidate/release-promotion-clients-published.json --stage clients-published --evidence-url "https://github.com/${{ github.repository }}/releases/tag/$TAG" --evidence-sha256 "$SIGNED_SHA" --recorded-at-unix-seconds "$NOW" --resume
      - name: 上传客户端晋级证据
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          RECEIPT=release-promotion-clients-published.json
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
          if grep -Fxq "$RECEIPT" "$RUNNER_TEMP/release-assets.txt"; then
            mkdir -p "$RUNNER_TEMP/published-receipt"
            gh release download "$TAG" --pattern "$RECEIPT" --dir "$RUNNER_TEMP/published-receipt" --clobber
            cmp "candidate/$RECEIPT" "$RUNNER_TEMP/published-receipt/$RECEIPT"
          else
            gh release upload "$TAG" "candidate/$RECEIPT"
          fi
          VERSION="${TAG#v}"
          python tools/release_surface.py apply --repository "${{ github.repository }}" --tag "$TAG" --version "$VERSION"
