name: macOS 构建与打包

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: '1'
  RUST_BACKTRACE: '1'

jobs:
  verify:
    name: macOS ARM64 构建与打包
    # 公开仓库的标准 macOS runner 不计费；更大规格的 runner 即使公开仓库也要付费，不要改。
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 版本 7.0.1
      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 版本 7.0.0
        with:
          node-version-file: .node-version
      - name: 安装 Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: 恢复 macOS 编译缓存
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # 版本 2.9.2
        with:
          shared-key: macos-desktop
          add-job-id-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 安装固定依赖
        run: corepack pnpm@10.28.0 install --frozen-lockfile
      - name: 编译 Bridge 与桌面壳
        run: |
          cargo check -p agent-room-bridge --all-targets
          corepack pnpm@10.28.0 --filter @agent-room/web build:desktop
          corepack pnpm@10.28.0 --filter @agent-room/desktop prepare:sidecar
          cargo test -p agent-room-desktop --all-features
      - name: 构建未签名测试包
        env:
          # 临时签名：没有 Developer ID 证书也能装出可运行的 .app，但 Gatekeeper 仍会拦公开分发。
          APPLE_SIGNING_IDENTITY: '-'
        run: corepack pnpm@10.28.0 build:desktop
      - name: 运行打出来的桌面端
        run: |
          app="$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          ls "$app/Contents/MacOS"
          # 桌面端和三个 sidecar 都在同一个目录里，必须点名，不能按文件名顺序取第一个。
          binary="$app/Contents/MacOS/agent-room-desktop"
          test -x "$binary"
          expected="$(python3 -c 'from pathlib import Path; import sys; sys.path.insert(0, "."); from tools.release_ci import workspace_version; print(workspace_version(Path("Cargo.toml")))')"
          actual="$("$binary" --installer-version)"
          test "$actual" = "$expected"
          echo "已打包并运行 $actual"
          find target/release/bundle -maxdepth 2 -name '*.dmg' -print
      - name: 诊断 Bridge 在 runner 上的行为
        run: |
          app="$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          export AGENT_ROOM_BRIDGE_DATA_DIR="$RUNNER_TEMP/bridge-data"
          export AGENT_ROOM_BRIDGE_SECURE_STORAGE_SERVICE="dev.agent-room.diagnose.$RANDOM"
          security list-keychains
          set +e
          # 直接跑 Bridge，把输出留下来：验收模式会等它退出，先看清楚它到底做了什么。
          timeout 90 "$app/Contents/MacOS/agent-room-bridge" > "$RUNNER_TEMP/bridge.log" 2>&1
          echo "bridge exit=$?"
          set -e
          echo "--- bridge output (first 60 lines)"
          head -60 "$RUNNER_TEMP/bridge.log" || true
      - name: 验收磁盘映像
        run: |
          image="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$image"
          version="$(python3 -c 'from pathlib import Path; import sys; sys.path.insert(0, "."); from tools.release_ci import workspace_version; print(workspace_version(Path("Cargo.toml")))')"
          # 报告写到仓库外，保持工作树干净，后面的构建卫生检查才有意义。
          python3 tools/macos_bundle_acceptance.py --image "$image" --expected-version "$version" --report "$RUNNER_TEMP/macos-bundle-acceptance.json"
          cat "$RUNNER_TEMP/macos-bundle-acceptance.json"
      - name: 检查构建卫生
        run: python3 tools/build_hygiene.py
      - name: 组装 macOS ARM64 测试包
        run: python3 tools/closed_test.py package --platform-tag macos-arm64
      - name: 上传构建产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 版本 7.0.1
        with:
          name: macos-arm64
          path: artifacts/closed-test/packages/macos-arm64/
          if-no-files-found: error
          retention-days: 7
